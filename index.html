/* ---- STAGE 7 : Assure effectiveness and improve ---- */
registerStage({
  id:'S7', num:7, code:'S7', name:'Assure effectiveness and improve',
  accountable:'Chief Information Security Officer',
  lead:'Security Assurance Lead',
  why:'Implementation and operation are not the same as assurance. This stage independently checks that requirements actually map to controls, controls actually map to tests, tests actually produce evidence, and findings actually drive a state decision — then loops back to whichever earlier stage needs correcting.',
  inputs:['All control records (Stages 3-6)','Exception register (Stage 3)','Operational findings log (Stage 6)'],
  standards:['Proposed standard: Assurance and Internal Review Standard'],
  externalRefs:['ISO/IEC 27001:2022 clause 9 — Performance evaluation','NIST CSF 2.0 — Govern (GV.OV) oversight category'],
  greenfield:'Build the assurance cadence in from the first pilot go-live, so the loop-back habit is established before scale makes retrofitting review painful.',
  existing:'Prioritise assurance review on domains with the weakest Stage 2 gap findings and the most Stage 3 exceptions, since these carry the highest residual risk.',
  outputs:['Assurance review findings per domain','Updated risk and exception status','Continuous improvement backlog','Loop-back referrals to earlier stages'],
  gate:'Gate (loop): assurance findings are reviewed by the accountable executive at a fixed cadence; any finding requiring architecture, requirement or implementation change is referred back to the relevant stage rather than resolved informally within Stage 7.',
  bestPractices:[
    {text:'Independently verify evidence rather than accepting a control owner\'s self-report — assurance loses value if it only restates what implementers already claimed.', stepRef:'S7.03'},
    {text:'Treat every requirement → control → test → evidence → state chain as something to check end to end, not just the final state.', stepRef:'S7.02'},
    {text:'Route findings back to the owning stage explicitly (e.g. a design flaw goes back to Stage 4, not patched informally in Stage 7).', stepRef:'S7.09'},
    {text:'Re-review exceptions on their expiry date without exception — an expired exception with no re-review silently becomes an unapproved gap.', stepRef:'S7.05'},
    {text:'Keep AI-assisted analysis optional and human-verified; never let an automated summary stand in as the assurance record itself.'},
    {text:'Publish assurance findings in the same place implementers already look, so the loop-back is visible, not buried in a separate report.'}
  ],
  mistakes:[
    {text:'Accepting "implemented" build state as sufficient evidence without checking the linked test actually passed.', stepRef:'S7.02'},
    {text:'Letting an exception quietly roll past its expiry date without a re-review.', stepRef:'S7.05'},
    {text:'Resolving a systemic architecture problem informally within Stage 7 instead of looping it back to Stage 4.', stepRef:'S7.09'}
  ],
  reqs:[
    {id:'REQ-7.1', text:'An assurance review cadence is defined and followed.', accept:'Review calendar exists with completed review records at the agreed cadence.'},
    {id:'REQ-7.2', text:'Requirement-to-evidence traceability is checked, not assumed.', accept:'Sample trace records show requirement → control → test → evidence → state for a cross-section of controls.'},
    {id:'REQ-7.3', text:'All exceptions are re-reviewed by their expiry date.', accept:'No exception register entry has an expiry date in the past without a re-review record.'},
    {id:'REQ-7.4', text:'Findings are routed back to the correct owning stage.', accept:'Loop-back log shows each finding referred to a named stage with acknowledgement.'},
    {id:'REQ-7.5', text:'A continuous improvement backlog exists and is actioned.', accept:'Backlog items show status progression, not a static unchanging list.'}
  ],
  diagram:'d-s7-assurance-loop',
  actions:[
    {id:'S7.01', title:'Define the assurance review cadence', accountable:'Security Assurance Lead', evidence:'Review calendar',
      how:['Set a fixed review cadence per domain (e.g. quarterly) and a triggered review on major change.','Publish the calendar so domain delegates know when to expect review.','Align exception expiry reviews to the same calendar where practical.']},
    {id:'S7.02', title:'Trace requirement → control → test → evidence → state', accountable:'Security Assurance Lead', evidence:'Traceability sample records',
      how:['Select a representative sample of controls across domains each cycle.','For each, independently verify the linked requirement, the test that was run, the evidence produced, and the recorded state.','Flag any break in the chain (e.g. state marked implemented with no linked evidence) as a finding.']},
    {id:'S7.03', title:'Independently verify a sample of evidence', accountable:'Security Assurance Lead', evidence:'Independent verification log',
      how:['Do not rely solely on the control owner\'s self-report — inspect the underlying evidence artefact directly where feasible.','Re-run a lightweight version of the original test where practical to confirm the control still behaves as recorded.','Record discrepancies between claimed and observed state as findings.']},
    {id:'S7.04', title:'Review monitoring and operational findings', accountable:'Security Assurance Lead', evidence:'Operational findings review record',
      how:['Pull the Stage 6 operational findings log for the review period.','Confirm each finding has a disposition (fixed, in progress, or referred).','Escalate stale findings with no progress.']},
    {id:'S7.05', title:'Re-review exceptions ahead of expiry', accountable:'Domain delegates / accountable executive', evidence:'Exception re-review record',
      how:['Pull exceptions expiring within the review cycle from the register.','Re-assess whether the original justification still holds and whether remediation has progressed.','Renew, close, or escalate each exception — never let it lapse silently.']},
    {id:'S7.06', title:'Assess AI-assisted findings with human verification', accountable:'Security Assurance Lead', evidence:'AI-assist review note',
      how:['Where AI dashboards or reporting tools are used, treat their output as a starting point, not a final finding.','Have a named reviewer confirm any AI-surfaced finding against underlying evidence before it is recorded.','Document that AI use was optional and human-verified, per the framework\'s stated principle.']},
    {id:'S7.07', title:'Quantify residual risk per domain', accountable:'Security Assurance Lead', evidence:'Residual risk summary',
      how:['Summarise open gaps, open exceptions and unresolved findings per domain.','Present residual risk in terms the accountable executive can act on, not raw counts alone.','Carry unresolved high residual risk items to the next review cycle explicitly.']},
    {id:'S7.08', title:'Build the continuous improvement backlog', accountable:'Security Assurance Lead', evidence:'Improvement backlog',
      how:['Convert findings into discrete, assignable backlog items.','Prioritise using residual risk and any regulatory obligation linkage from Stage 3.','Track backlog item status over successive review cycles.']},
    {id:'S7.09', title:'Route findings back to the owning stage', accountable:'Security Assurance Lead', evidence:'Loop-back referral log',
      how:['Classify each finding by which stage actually owns the fix: a requirement gap goes to Stage 3, an architecture flaw to Stage 4, an implementation defect to Stage 5, an operational gap to Stage 6.','Send the referral to the relevant stage lead with enough context to act.','Track referrals to acknowledgement and resolution, not just to being sent.']},
    {id:'S7.10', title:'Report assurance outcomes to the accountable executive', accountable:'Security Assurance Lead', evidence:'Assurance report',
      how:['Summarise review coverage, findings, residual risk and backlog status for the period.','Present the report at the cadence set in S7.01.','Record the accountable executive\'s decisions on any item requiring executive sign-off.']},
    {id:'S7.11', title:'Update the requirements catalogue where warranted', accountable:'Governance Lead', evidence:'Requirements catalogue change log',
      how:['Where assurance findings reveal a genuine requirements gap (not just an implementation gap), propose a requirements catalogue update.','Route the proposed change back through Stage 3 approval rather than editing it informally.','Version the requirements catalogue on each approved change.']},
    {id:'S7.12', title:'Confirm evidence retention and integrity', accountable:'Security Assurance Lead', evidence:'Evidence integrity check record',
      how:['Confirm assurance evidence itself is retained per the Stage 6 retention settings.','Spot-check evidence integrity (e.g. tamper-evidence, access logging on the evidence store).','Record any integrity concern as a finding in its own right.']},
    {id:'S7.13', title:'Close the assurance cycle and schedule the next', accountable:'Accountable executive', evidence:'Cycle closure record',
      how:['Confirm all findings from the cycle have a disposition (resolved, in progress with owner, or accepted risk).','Schedule the next review cycle per the cadence.','Sign the cycle closure record — assurance loops back to any stage rather than terminating.']}
  ]
});
DIAGRAMS['d-s7-assurance-loop'] = {
  title:'Requirement → control → test → evidence → state → decision loop',
  caption:'Assurance independently traces the full chain from requirement to recorded state, and any break in the chain is routed back to the owning stage rather than patched informally within assurance itself.',
  nodes:[
    {id:'req', kind:'data', x:0, y:0, label:'Requirement'},
    {id:'ctrl', kind:'control', x:1.3, y:0, label:'Control'},
    {id:'test', kind:'decision', x:2.6, y:0, label:'Test'},
    {id:'evid', kind:'data', x:3.9, y:0, label:'Evidence'},
    {id:'state', kind:'accepted', x:3.9, y:1.3, label:'Recorded state'},
    {id:'dec', kind:'decision', x:2.0, y:1.3, label:'Chain intact?'},
    {id:'loop', kind:'urgent', x:0.3, y:2.4, w:2, label:'Loop back to owning stage (3-6)'}
  ],
  edges:[
    {from:'req', to:'ctrl'}, {from:'ctrl', to:'test'}, {from:'test', to:'evid'}, {from:'evid', to:'state'},
    {from:'state', to:'dec'},
    {from:'dec', to:'loop', label:'no', kind:'urgent'},
    {from:'dec', to:'req', label:'yes: confirmed', back:true}
  ]
};

GLOSSARY.push(

  {term:'Gate', def:'The documented condition that must be true before a stage is considered complete enough to progress.'},
  {term:'Delegated authority', def:'Decision-making power formally handed by the accountable executive to a named delegate, bounded by an escalation threshold.'},
  {term:'Evidence', def:'A durable artefact (record, log, screenshot, signed document) proving a state — distinct from the state itself.'},
  {term:'Documented / configured / tested / maintained', def:'Four distinct states of a control. A control can be documented without being configured, configured without being tested, and tested once but not maintained.'},
  {term:'Approved exception', def:'A documented, time-bound risk acceptance for a gap against the baseline. It is never equivalent to a passed test.'},
  {term:'Implementation state vs validation state', def:'Whether a control has been built (implementation state) is a separate question from whether it has been proven to work (validation state).'},
  {term:'Origin lock', def:'Configuration ensuring an application\'s origin only accepts traffic that has passed through the edge/WAF layer, blocking direct-to-origin access.'},
  {term:'Dependency-led recovery', def:'Recovering systems in the order their dependencies require (e.g. identity before anything that authenticates against it), not in order of convenience.'},
  {term:'JIT / PIM', def:'Just-in-time / privileged identity management — granting elevated access for a bounded time rather than as a standing right.'},
  {term:'Break-glass', def:'An emergency access path used when normal access methods are unavailable, with heightened logging and mandatory post-use review.'},

function svgEl(tag, attrs){
  const el = document.createElementNS('http://www.w3.org/2000/svg', tag);
  for(const k in attrs) el.setAttribute(k, attrs[k]);
  return el;
}
function cssVar(name){ return getComputedStyle(document.documentElement).getPropertyValue(name).trim(); }
function wrapLabel(text, width){
  width = width || 16;
  const words = String(text).split(' ');
  const lines = []; let cur = '';
  words.forEach(w=>{
    if((cur + ' ' + w).trim().length > width){ if(cur) lines.push(cur.trim()); cur = w; }
    else cur = (cur + ' ' + w).trim();
  });
  if(cur) lines.push(cur.trim());
  return lines.slice(0,3).join('\n');
}
function buildFlowDiagram(title, caption, steps){

function renderDiagram(idOrData){
  const id = typeof idOrData === 'string' ? idOrData : ('inline-'+Math.random().toString(36).slice(2));
  const d = typeof idOrData === 'string' ? DIAGRAMS[idOrData] : idOrData;
  if(!d) return '<p class="lede">Diagram not yet available.</p>';
  const cellW = 190, cellH = 110, pad = 40;
  let maxX = 0, maxY = 0;
  d.nodes.forEach(n=>{ maxX = Math.max(maxX, n.x + (n.w||1)); maxY = Math.max(maxY, n.y+1); });
  const width = maxX*cellW + pad*2, height = maxY*cellH + pad*2;
  const svg = svgEl('svg',{class:'diagram', viewBox:`0 0 ${width} ${height}`, role:'img', 'aria-labelledby':id+'-title'});
  const title = svgEl('title',{id:id+'-title'}); title.textContent = d.title; svg.appendChild(title);
  // zones
  (d.zones||[]).forEach(z=>{
    const zx = pad + z.x*cellW, zy = pad + z.y*cellH, zw = z.w*cellW, zh = z.h*cellH;
    svg.appendChild(svgEl('rect',{x:zx,y:zy,width:zw,height:zh,rx:10,fill:'none',stroke:'var(--line)','stroke-dasharray':'4 4'}));
    const t = svgEl('text',{x:zx+8,y:zy+16,'font-size':11,fill:'var(--ink-faint)','font-weight':700}); t.textContent = z.label; svg.appendChild(t);
  });
  const center = n => ({x: pad + (n.x + (n.w||1)/2)*cellW, y: pad + (n.y+0.5)*cellH});
  const byId = {}; d.nodes.forEach(n=>byId[n.id]=n);
  // edges (drawn first so nodes sit above)
  (d.edges||[]).forEach(e=>{
    const a = byId[e.from], b = byId[e.to]; if(!a||!b) return;
    const p1 = center(a), p2 = center(b);
    const colorVar = e.kind==='urgent' ? 'var(--red)' : 'var(--ink-faint)';
    let path;
    if(e.back){
      const midY = Math.max(p1.y,p2.y) + 55;
      path = `M ${p1.x} ${p1.y} C ${p1.x-70} ${midY}, ${p2.x-70} ${midY}, ${p2.x} ${p2.y}`;
    } else if(Math.abs(p1.x-p2.x) > 2 && Math.abs(p1.y-p2.y) > 2){
      path = `M ${p1.x} ${p1.y} L ${p1.x} ${(p1.y+p2.y)/2} L ${p2.x} ${(p1.y+p2.y)/2} L ${p2.x} ${p2.y}`;
    } else {
      path = `M ${p1.x} ${p1.y} L ${p2.x} ${p2.y}`;
    }
    svg.appendChild(svgEl('path',{d:path, fill:'none', stroke:colorVar, 'stroke-width':1.6, 'marker-end':'url(#arrow)'}));
    if(e.label){
      const lx = (p1.x+p2.x)/2, ly = (p1.y+p2.y)/2 - 6;
      const t = svgEl('text',{x:lx,y:ly,'font-size':10,fill:'var(--ink-faint)','text-anchor':'middle'}); t.textContent = e.label; svg.appendChild(t);
    }
  });
  // arrow marker
  const defs = svgEl('defs',{});
  defs.innerHTML = '<marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="var(--ink-faint)"/></marker>';
  svg.insertBefore(defs, svg.firstChild);
  // nodes
  d.nodes.forEach(n=>{
    const nx = pad + n.x*cellW + 8, ny = pad + n.y*cellH + 14, nw = (n.w||1)*cellW - 16, nh = cellH - 28;
    const colorVar = 'var(' + (NODE_COLORS[n.kind]||'--ink') + ')';
    const g = svgEl('g',{});
    g.appendChild(svgEl('rect',{x:nx,y:ny,width:nw,height:nh,rx:10,fill:'var(--surface)',stroke:colorVar,'stroke-width':1.6}));
    const lines = String(n.label).split('\n');
    lines.forEach((line,i)=>{
      const t = svgEl('text',{x:nx+nw/2, y: ny+nh/2 + (i-(lines.length-1)/2)*13 + 4, 'font-size':11.5,'font-weight':600,'text-anchor':'middle',fill:'var(--ink)'});
      t.textContent = line; g.appendChild(t);
    });
    svg.appendChild(g);
  });
  const wrap = document.createElement('div');
  wrap.appendChild(svg);
  const fig = document.createElement('figure'); fig.className='diagram-fig';
  fig.innerHTML = `<div class="scroll-x">${wrap.innerHTML}</div><figcaption><strong>${esc(d.title)}.</strong> ${esc(d.caption)}</figcaption>`;
  return fig.outerHTML;
}

function fwFilterBar(){
  return `<input class="rail-search" style="max-width:280px;display:inline-block;margin-right:8px" placeholder="Filter text…" oninput="fwFilter.q=this.value;render()" value="${esc(fwFilter.q)}">

function fwMatch(text, domain){

}

    artefact:'Tabletop exercise record: "Scenario: compromised customer session token. Finding: containment authority confirmed within SLA; playbook updated to add automatic session revocation step."'},
  {stage:'S7', title:'Assure effectiveness and improve', actions:['S7.03','S7.05','S7.09'],
    body:'Assurance independently re-runs the cross-customer negative test on a sampling basis the following quarter rather than trusting the Stage 5 record indefinitely. It checks the flat-network remediation is still in place, since configuration drift is the usual way a fixed gap quietly reopens. Any new finding is routed back to the stage that owns the fix — a repeat of the flat-network issue would go back to Stage 5/6 as an operational finding, not be patched informally inside the assurance review itself.',
    artefact:'Assurance sample report: "2026-Q2 — cross-customer isolation re-tested: still blocks (PASS). Network segmentation re-checked: still in place (PASS). No loop-back required this cycle."'}
];
DIAGRAMS['d-claimsportal'] = {
  title:'ClaimsPortal — one external web app, genuinely hybrid',
  caption:'A customer submits a claim through the cloud-hosted portal; it passes through the edge chain and queue into an on-premises processing engine and database, while independently reaching a SaaS case-management system, with status reconciled back to the customer. Staff identity (workforce) is architecturally separate from customer identity throughout.',
  zones:[
    {x:0,y:0,w:1.4,h:3.2,label:'Internet'},
    {x:1.5,y:0,w:1.9,h:3.2,label:'Cloud (Azure)'},
    {x:3.5,y:0,w:1.4,h:3.2,label:'On-premises'},
    {x:5.0,y:0,w:1.4,h:3.2,label:'SaaS'}
  ],
  nodes:[
    {id:'cust', kind:'identity', x:0, y:0.2, label:'Customer\n(Entra External ID)'},
    {id:'staff', kind:'identity', x:0, y:1.6, label:'Claims staff\n(Entra ID + PIM)'},
    {id:'fd', kind:'control', x:1.5, y:0.2, label:'Front Door + WAF'},
    {id:'apim', kind:'control', x:1.5, y:1.4, label:'API Management'},
    {id:'app', kind:'control', x:3.0, y:0.2, w:0.9, label:'App Service\n(portal)'},
    {id:'sb', kind:'data', x:3.5, y:1.4, label:'Service Bus queue'},
    {id:'onprem', kind:'control', x:5.0, y:1.4, w:0, label:''},
    {id:'sql', kind:'data', x:3.5, y:2.6, label:'On-prem processing\n+ SQL Server'},
    {id:'saas', kind:'data', x:5.0, y:0.2, label:'SaaS case management'},
    {id:'recon', kind:'accepted', x:5.0, y:2.6, label:'Reconciled status'},
    {id:'denied', kind:'denied', x:0, y:2.8, label:'Customer B → Customer A claim: denied'}
  ],
  edges:[
    {from:'cust', to:'fd', label:'submits claim'}, {from:'fd', to:'app'}, {from:'app', to:'apim'},
    {from:'apim', to:'sb'}, {from:'sb', to:'sql'}, {from:'apim', to:'saas', label:'independent case record'},
    {from:'sql', to:'recon'}, {from:'saas', to:'recon', label:'status sync'},
    {from:'staff', to:'apim', label:'triage (PIM-elevated)'},
    {from:'denied', to:'apim', label:'blocked', kind:'urgent', back:true}
  ]
};
function pageClaimsPortal(){
  let html = `<div class="crumbs"><a href="#/overview">Overview</a> / Worked example — ClaimsPortal</div>
  <h1>End-to-end example: ClaimsPortal</h1>
  <p class="lede">One external, customer-facing web app, genuinely mixing on-premises, cloud and SaaS, driven through all seven stages using this guide's own domain codes, requirement IDs and disciplines. Synthetic example — nothing described here has actually been executed.</p>
  ${renderDiagram('d-claimsportal')}`;
  CLAIMSPORTAL.forEach((c,i)=>{
    const stage = STAGES.find(s=>s.id===c.stage);
    const firstOpen = i===0 ? ' open' : '';
    html += `<div class="step${firstOpen}" style="margin-bottom:10px">
      <button class="step-head" onclick="this.parentElement.classList.toggle('open')">
        <span class="step-num">${i+1}</span>
        <span class="step-title">${stage?`Stage ${stage.num} — ${esc(c.title)}`:esc(c.title)}</span>
        <span class="step-chev">›</span>
      </button>
      <div class="step-body">
        <p style="font-size:13.5px;color:var(--ink-soft)">${esc(c.body)}</p>
        <div class="step-sub" style="grid-template-columns:1fr">
          <div class="box"><b>Example artefact (synthetic, not executed)</b>${esc(c.artefact)}</div>
        </div>
        <div class="chiprow">${c.actions.map(a=>`<a class="badge" href="#/stage/${c.stage.replace('S','')}#step-${a}">${a}</a>`).join(' ')}${stage?` <a class="badge" href="#/stage/${stage.num}">Full stage detail →</a>`:''}</div>
      </div>
    </div>`;
  });
  html += `<p style="font-size:12px;color:var(--ink-faint);margin-top:10px">See also the <a href="#/worked-service">generic worked service (CUSTOMER_A/REQUEST_A)</a> for the abstract version of this same pattern.</p>`;
  html += footer();
  return html;
}

function pageFallback(title){
  return `<h1>${esc(title)}</h1><p class="lede">This page is scaffolded and will be populated in the next build pass, following the same guided-phase structure used on the Overview and Stage pages.</p>` + footer();
}

function pageBaselinesIndex(){
  let html = `<div class="crumbs"><a href="#/overview">Overview</a> / Baselines</div>
  <h1>Minimum baseline — 15 domains, ${BASELINE_CONTROLS.length} controls</h1>
  <p class="lede">The approved Stage 3 baseline, organised into 15 domains. Each domain page walks through its 5-step implementation recipe as a guided phase, then lists every control to work through in order.</p>
  <div class="grid grid-3">`;
  DOMAINS.forEach(d=>{
    const n = BASELINE_CONTROLS.filter(c=>c.domain===d.code).length;
    html += `<a class="card" href="#/domain/${d.code}" style="display:block;color:inherit">
      <div class="pill cobalt">${esc(d.code)}</div>
      <h3 style="margin:10px 0 6px;font-size:14.5px">${esc(d.name)}</h3>
      <div style="font-size:12px;color:var(--ink-faint)">${n} controls</div>
    </a>`;
  });
  html += `</div>` + footer();
  return html;
}

function pageDomain(code){
  const d = DOMAINS.find(x=>x.code===code);
  if(!d) return pageFallback('Domain not found');
  const ctrls = BASELINE_CONTROLS.filter(c=>c.domain===d.code);
  let html = `<div class="crumbs"><a href="#/overview">Overview</a> / <a href="#/baselines">Baselines</a> / ${esc(d.code)}</div>
  <div class="stagehead"><div class="numeral" style="font-size:44px">${esc(d.code)}</div><h1 style="margin:0">${esc(d.name)}</h1></div>
  <div class="metaGrid">
    <div><div class="k">Owners</div><div class="v">${esc(d.owners)}</div></div>
    <div><div class="k">Evidence</div><div class="v">${esc(d.evidence)}</div></div>
    <div><div class="k">Standards</div><div class="v">${d.standards.join('; ')}</div></div>
    <div><div class="k">External references</div><div class="v">${d.externalRefs.join('; ')}</div></div>
  </div>`;
  html += renderDiagram(buildFlowDiagram(
    `${d.code} — five-step implementation recipe`,
    `The implementation recipe for ${d.name}, in order. Greenfield builds this in from the start; existing environments retrofit it against what's already running.`,
    d.recipe
  ));
  html += renderGuidedPhase({
    why: d.purpose,
    steps: d.recipe.map((step,i)=>({
      id:`${d.code}-step-${i+1}`, title:step,
      how:[`Apply this step to every in-scope asset covered by the ${d.code} domain.`, i===0? d.greenfield : (i===d.recipe.length-1? d.existing : 'Confirm the step against the relevant baseline control below before moving to the next.')],
      accountable:d.owners, evidence:d.evidence
    })),
    verifyItems:[
      {id:d.code+'-test-positive', label:'Positive test — '+d.tests.positive},
      {id:d.code+'-test-negative', label:'Negative test — '+d.tests.negative},
      {id:d.code+'-test-failure', label:'Failure test — '+d.tests.failure}
    ],
    gateText:'Every control in this domain should be worked through to completion, in order, before treating the domain as part of the achieved baseline.',
    prevLink:{href:'#/baselines', label:'All baseline domains'},
    nextLink:null
  });
  html += `<div class="section-h"><h2>Controls in this domain</h2><span class="badge">${ctrls.length} controls</span></div>
  <div class="scroll-x"><table><thead><tr><th>ID</th><th>Title</th><th>Description</th></tr></thead><tbody>`;
  ctrls.forEach(c=>{
    html += `<tr><td><code class="id">${esc(c.id)}</code></td><td style="font-weight:600">${esc(c.title)}</td><td>${esc(c.desc)}</td></tr>`;
  });
  html += `</tbody></table></div>` + footer();
  return html;
}

function render(){
  renderTopbar();
  renderRail();
  const hash = location.hash || '#/apply';
  const parts = hash.replace('#/','').split('/');
  let html = '';
  if(parts[0]==='apply'){ html = pageApplication(); }
  else if(parts[0]==='overview' || parts[0]===''){ html = pageOverview(); }
  else if(parts[0]==='stage'){ html = pageStage(parseInt(parts[1],10)); }
  else if(parts[0]==='disciplines'){ html = pageDisciplines(null); }
  else if(parts[0]==='discipline'){ html = pageDisciplines(parts[1]); }
  else if(parts[0]==='frameworks'){ html = pageFrameworks(parts[1]); }
  else if(parts[0]==='baselines'){ html = pageBaselinesIndex(); }
  else if(parts[0]==='domain'){ html = pageDomain(parts[1]); }
  else if(parts[0]==='tools'){ html = pageTools(); }
  else if(parts[0]==='records'){ html = pageRecords(); }
  else if(parts[0]==='requirements'){ html = pageRequirements(); }
  else if(parts[0]==='glossary'){ html = pageGlossary(); }
  else if(parts[0]==='standards'){ html = pageStandards(); }
  else if(parts[0]==='raci'){ html = pageRaci(); }
  else if(parts[0]==='capabilities'){ html = pageCapabilities(); }
  else if(parts[0]==='rollout'){ html = pageRollout(); }
  else if(parts[0]==='worked-service'){ html = pageWorkedService(); }
  else if(parts[0]==='example'){ html = pageClaimsPortal(); }
  else if(parts[0]==='checkpoint'){ html = pageCheckpoint(); }
  else if(parts[0]==='search'){ html = pageSearch(decodeURIComponent(parts[1]||'')); }
  else { html = pageOverview(); }
  document.getElementById('main').innerHTML = html;
  window.scrollTo(0,0);
  DB.route = hash; saveStore();
}

/* theme */
function applyTheme(){
  if(DB.theme==='light') document.documentElement.setAttribute('data-theme','light');
  else if(DB.theme==='dark') document.documentElement.setAttribute('data-theme','dark');
  else document.documentElement.removeAttribute('data-theme');
}
document.getElementById('themeBtn').addEventListener('click', ()=>{
  DB.theme = DB.theme==='auto' ? 'light' : DB.theme==='light' ? 'dark' : 'auto';
  saveStore(); applyTheme();
});
document.getElementById('menuBtn').addEventListener('click', ()=>{
  const r = document.getElementById('rail'); r.classList.toggle('open');
});

applyTheme();
window.addEventListener('hashchange', render);
render();
</script>
</body>
</html>
