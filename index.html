        'Dependency and build-system compromise reaches production without touching your code.',
        'Long-lived CI credentials are a standard lateral movement path.',
        'Public exposure of an internal API is usually a configuration error, not an exploit.'
      ],'wn')}
    </div>
  </section>`,
  resilience: () => `
  <section>
    <h2>Incident response lifecycle</h2>
    <p>Detection and triage can be operated by an MSSP. Containment is a named internal decision, and accountability does not transfer.</p>
    ${renderDiagram(DG['dg-ir'])}
    ${tableOf(['Phase','What good looks like','Evidence'],[
      ['Prepare','Playbooks per incident type, containment authority named and rehearsed','Tabletop exercise record'],
      ['Detect','Alerts tuned, and a missing feed raises its own alert','Alert and feed-health logs'],
      ['Triage','Severity and scope agreed, incident formally declared','Incident record'],
      ['Contain','Authority reachable in and out of hours, action approved','Containment approval'],
      ['Eradicate','Root cause removed, not just the symptom','Change record'],
      ['Recover','Dependency-led restore, service validated before reopening','Recovery test record'],
      ['Learn','Findings routed to the stage that owns the fix','Post-incident review']
    ])}
    <div class="grid g2" style="margin-top:1rem">
      ${panelList('Practice',[
        'Name the containment authority before an incident, not during one.',
        'Recover in dependency order: identity before the services that authenticate to it.',
        'A backup job is not a recovery test; a validated restore is.',
        'Route post-incident findings to the owning stage, not into assurance.'
      ],'ck')}
      ${panelList('Pitfalls',[
        'Playbooks written but never rehearsed against a realistic scenario.',
        'Assuming an MSSP service level transfers accountability for the outcome.',
        'Containment decisions stalling out of hours because authority is unclear.',
        'Recovery ordered by convenience, producing a restored but unusable service.'
      ],'wn')}
    </div>
  </section>`
};
function pageDiscipline(id){
  const d = DISCIPLINES.find(x=>x.id===id);
  if(!d) return pageNotFound();
  return `
  <section>
    <p class="crumb"><a href="#/disciplines">Disciplines</a> / ${esc(d.name)}</p>
    <h1>${esc(d.name)}</h1>
    <p class="lede">${esc(d.summary)}</p>
  </section>
  <section>
    <h2>Core practices</h2>
    <div class="panel"><ul class="ck">${d.corePractices.map(p=>`<li>${esc(p)}</li>`).join('')}</ul></div>
  </section>
  <section>
    <h2>Reference profile</h2>
    ${tableOf(['Element','Target'], d.referenceProfile.map(r=>[esc(r.k), esc(r.v)]))}
  </section>
  ${DISCIPLINE_EXTRA[d.id] ? DISCIPLINE_EXTRA[d.id]() : ''}
  <section>
    <h2>Across the lifecycle</h2>
    ${tableOf(['Stage','Focus','Example tools'], d.stages.map((s,i)=>{
      const st = STAGES[i];
      return [
        st?`<a href="#/stage/${st.slug}">${esc(st.short)}</a>`:'',
        esc(s.focus),
        (s.tools||[]).length ? s.tools.map(t=>`<span class="tag">${esc(t)}</span>`).join('') : '<span class="muted">—</span>'
      ];
    }))}
  </section>`;
}

/* ---- standards mapping ---- */
const CSF_PREFIX_MAP = [
  ['GV','GOV'],['ID.AM','INV'],['PR.AA','IAM'],['PR.DS','DATA'],
  ['PR.PS','END'],['PR.PS','DEV'],['PR.IR','NET'],['PR.IR','CLD'],
  ['DE','OPS'],['RS','OPS'],['RC','REC']
];
function csfDomainsFor(catId){
  const out = new Set();
  CSF_PREFIX_MAP.forEach(([pre,dom])=>{ if(catId.indexOf(pre)===0) out.add(dom); });
  return [...out];
}
function frameworkItems(){
  const out = [];
  FRAMEWORKS.iso27001.themes.forEach(t=>t.items.forEach(i=>out.push({fw:'iso27001',id:i[0],title:i[1],domain:i[2],group:t.name})));
  FRAMEWORKS.csf2.functions.forEach(f=>f.categories.forEach(c=>{
    csfDomainsFor(c[0]).forEach(dom=>out.push({fw:'csf2',id:c[0],title:c[1]+' — '+c[2],domain:dom,group:f.code+' '+f.name}));
    if(!csfDomainsFor(c[0]).length) out.push({fw:'csf2',id:c[0],title:c[1]+' — '+c[2],domain:null,group:f.code+' '+f.name});
  }));
  FRAMEWORKS.nist80053.families.forEach(f=>out.push({fw:'nist80053',id:f[0],title:f[1]+' — '+f[2].join('; '),domain:f[3],group:'Families'}));
  FRAMEWORKS.cisv8.controls.forEach(c=>out.push({fw:'cisv8',id:'CIS '+c[0],title:c[1]+' ('+c[2]+' safeguards, '+c[3]+')',domain:c[4],group:'Controls'}));
  FRAMEWORKS.soc2.groups.forEach(g=>g.items.forEach(i=>out.push({fw:'soc2',id:i[0],title:i[1],domain:i[2],group:g.name})));
  FRAMEWORKS.more.groups.forEach(g=>g.items.forEach(i=>out.push({fw:'more',id:i[0],title:i[1],domain:i[2],group:g.name})));
  return out;
}
const FW_LABEL = {iso27001:'ISO/IEC 27001',csf2:'NIST CSF 2.0',nist80053:'NIST SP 800-53',cisv8:'CIS Controls v8',soc2:'SOC 2',more:'ASVS, SSDF, PCI DSS, Essential Eight'};
const groupLabel = g => String(g).replace(/^\d+\s+/,'').replace(/^./,ch=>ch.toUpperCase());
function mappedTo(code){
  if(!code) return '<span class="muted">—</span>';
  if(DOMAINS.some(d=>d.code===code)) return `<a href="#/controls/${code}"><span class="mono">${esc(code)}</span></a>`;
  const st = STAGES.find(s=>s.id===code);
  if(st) return `<a href="#/stage/${st.slug}">${esc(st.short)}</a>`;
  if(code==='PHY') return `<span class="tag">Physical, out of scope</span>`;
  return `<span class="tag">${esc(code)}</span>`;
}
const FW_SHORT = {iso27001:'ISO 27001',csf2:'NIST CSF',nist80053:'SP 800-53',cisv8:'CIS v8',soc2:'SOC 2',more:'ASVS, SSDF, PCI, E8'};
const FW_ORDER = ['iso27001','csf2','nist80053','cisv8','soc2','more'];
let fwFilter = 'iso27001';
function pageStandards(){
  const items = frameworkItems();
  const matrix = DOMAINS.map(d=>{
    const cells = FW_ORDER.map(f=>items.filter(i=>i.fw===f && i.domain===d.code).length);
    return {d, cells};
  });
  const level = n => n===0?0 : n<=2?1 : n<=5?2 : n<=10?3 : 4;
  const shown = items.filter(i=>i.fw===fwFilter);
  const groups = [...new Set(shown.map(i=>i.group))];
  return `
  <section>
    <h1>Standards mapping</h1>
    <p class="lede">Indicative thematic mapping between the control domains and widely used frameworks. Use each publisher's own mapping for audit purposes.</p>
  </section>
  <section>
    <h2>Coverage matrix</h2>
    <div class="tw"><table class="mx"><thead><tr><th>Domain</th>${FW_ORDER.map(f=>`<th style="text-align:center">${esc(FW_SHORT[f])}</th>`).join("")}</tr></thead>
    <tbody>${matrix.map(m=>`<tr><td><a href="#/controls/${m.d.code}"><span class="mono">${esc(m.d.code)}</span></a> ${esc(m.d.name)}</td>
      ${m.cells.map(n=>`<td class="c" data-l="${level(n)}">${n||'·'}</td>`).join('')}</tr>`).join('')}</tbody></table></div>
    <p class="small muted" style="margin-top:.5rem">Cell shading shows how many mapped items each domain carries in that framework.</p>
  </section>
  <section>
    <h2>Detail</h2>
    <div>${FW_ORDER.map(f=>`<button class="chip" aria-pressed="${f===fwFilter}" onclick="fwFilter='${f}';render()">${esc(FW_SHORT[f])}</button>`).join('')}</div>
    <p class="small muted">${shown.length} items in ${esc(FW_LABEL[fwFilter])}.</p>
    ${groups.map(g=>`<h3 style="margin-top:1.2rem">${esc(groupLabel(g))}</h3>
      ${tableOf(['ID','Item','Mapped to'], shown.filter(i=>i.group===g).map(i=>[
        `<span class="mono">${esc(i.id)}</span>`, esc(i.title), mappedTo(i.domain)
      ]))}`).join('')}
  </section>`;
}

/* ---- tools ---- */
let toolQuery = '', toolDomain = 'all';
function pageTools(){
  const q = toolQuery.trim().toLowerCase();
  const list = TOOLS.filter(t=>{
    if(toolDomain!=='all' && !(t.domains||[]).includes(toolDomain)) return false;
    if(q && !(t.name+' '+t.category+' '+t.use+' '+t.platform).toLowerCase().includes(q)) return false;
    return true;
  });
  const usedDomains = DOMAINS.filter(d=>TOOLS.some(t=>(t.domains||[]).includes(d.code)));
  return `
  <section>
    <h1>Tools</h1>
    <p class="lede">Illustrative examples only, mapped to domains and lifecycle stages. Verify capability, licensing and support before adopting anything here.</p>
  </section>
  <section>
    <input class="search" id="toolSearch" placeholder="Search tools" value="${esc(toolQuery)}" aria-label="Search tools" oninput="toolQuery=this.value;render();document.getElementById('toolSearch').focus()">
    <div style="margin-top:.7rem">
      <button class="chip" aria-pressed="${toolDomain==='all'}" onclick="toolDomain='all';render()">All</button>
      ${usedDomains.map(d=>`<button class="chip" aria-pressed="${toolDomain===d.code}" onclick="toolDomain='${d.code}';render()">${esc(d.code)}</button>`).join('')}
    </div>
    <p class="small muted" style="margin-top:.6rem" aria-live="polite">${list.length} of ${TOOLS.length} tools</p>
    ${tableOf(['Tool','Category','Platform','Use','Stages'], list.map(t=>[
      esc(t.name), esc(t.category), esc(t.platform), esc(t.use),
      (t.stages||[]).map(sid=>{ const st=STAGES.find(x=>x.id===sid); return st?`<a class="tag" href="#/stage/${st.slug}">${esc(st.short)}</a>`:''; }).join('')
    ]))}
  </section>`;
}

function pageGlossary(){
  return `
  <section>
    <h1>Glossary</h1>
    <p class="lede">Terms used consistently across the lifecycle, control baseline and disciplines.</p>
  </section>
  <section>${tableOf(['Term','Definition'], GLOSSARY.map(g=>[`<strong>${esc(g.term)}</strong>`, esc(g.def)]))}</section>`;
}

function pageNotFound(){
  return `<section><h1>Not found</h1><p class="lede">That page does not exist. Try the <a href="#/lifecycle">lifecycle</a> or the <a href="#/controls">control baseline</a>.</p></section>`;
}

/* ============================================================
   ROUTER
   ============================================================ */
const NAV = [
  {href:'#/',            label:'Application', match:p=>p[0]===''},
  {href:'#/lifecycle',   label:'Lifecycle',   match:p=>p[0]==='lifecycle'||p[0]==='stage'},
  {href:'#/controls',    label:'Controls',    match:p=>p[0]==='controls'},
  {href:'#/disciplines', label:'Disciplines', match:p=>p[0]==='disciplines'},
  {href:'#/standards',   label:'Standards',   match:p=>p[0]==='standards'},
  {href:'#/tools',       label:'Tools',       match:p=>p[0]==='tools'},
  {href:'#/glossary',    label:'Glossary',    match:p=>p[0]==='glossary'}
];
function parts(){
  const h = (location.hash || '#/').replace(/^#\/?/,'');
  return h.split('/');
}
function render(){
  const p = parts();
  document.getElementById('nav').innerHTML = NAV.map(n=>
    `<a href="${n.href}"${n.match(p)?' aria-current="page"':''}>${esc(n.label)}</a>`).join('');
  let html;
  switch(p[0]){
    case '':            html = pageApplication(); break;
    case 'lifecycle':   html = pageLifecycle(); break;
    case 'stage':       html = pageStage(p[1]); break;
    case 'controls':    html = p[1] ? pageDomain(p[1]) : pageControls(); break;
    case 'disciplines': html = p[1] ? pageDiscipline(p[1]) : pageDisciplines(); break;
    case 'standards':   html = pageStandards(); break;
    case 'tools':       html = pageTools(); break;
    case 'glossary':    html = pageGlossary(); break;
    default:            html = pageNotFound();
  }
  document.getElementById('main').innerHTML = html;
  document.title = (document.querySelector('#main h1')?.textContent || 'Security framework') + ' — Security framework';
}
let lastHash = location.hash;
window.addEventListener('hashchange', ()=>{ lastHash = location.hash; render(); window.scrollTo(0,0); });

/* theme */
function readTheme(){ try{ return localStorage.getItem('sf-theme') || 'auto'; }catch(e){ return 'auto'; } }
function writeTheme(v){ try{ localStorage.setItem('sf-theme', v); }catch(e){} }
function applyTheme(v){
  if(v==='auto') document.documentElement.removeAttribute('data-theme');
  else document.documentElement.setAttribute('data-theme', v);
  document.getElementById('themeBtn').textContent = v==='auto' ? 'Theme: auto' : (v==='dark' ? 'Theme: dark' : 'Theme: light');
}
document.getElementById('themeBtn').addEventListener('click', ()=>{
  const order = ['auto','light','dark'];
  const next = order[(order.indexOf(readTheme())+1) % order.length];
  writeTheme(next); applyTheme(next);
});
applyTheme(readTheme());
render();
</script>
