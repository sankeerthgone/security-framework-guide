<!DOCTYPE html>
<html lang="en-NZ">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Enterprise IT Security Framework — Interactive Build Guide</title>
<meta name="description" content="A step-by-step interactive build guide for an enterprise IT security framework: seven stages, fifteen baseline domains, ten security disciplines, framework crosswalks and a synthetic worked example.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#EDF0F4; --surface:#FFFFFF; --surface-2:#F5F7FA; --ink:#172131; --ink-soft:#4A5568; --ink-faint:#7C8798;
  --cobalt:#2346D2; --cobalt-soft:#E7ECFC; --line:#DDE3EC; --line-soft:#E9EDF3;
  --amber:#B9770E; --amber-bg:#FBF0DC; --green:#1E7A46; --green-bg:#DFF3E6; --red:#C13B3B; --red-bg:#FBE4E4; --grey:#6B7480; --grey-bg:#E8EAEE;
  --radius:12px; --radius-sm:8px; --shadow:0 1px 2px rgba(23,33,49,.06), 0 8px 24px -12px rgba(23,33,49,.12);
  --font:'Schibsted Grotesk',system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif;
  --maxw:1180px;
}
:root:not([data-theme="light"]){
  @media (prefers-color-scheme: dark){
    --paper:#11161F; --surface:#171E29; --surface-2:#1D2532; --ink:#EAEEF5; --ink-soft:#B7C0CE; --ink-faint:#7E8898;
    --cobalt:#7C93F0; --cobalt-soft:#1E2A4D; --line:#2A3342; --line-soft:#242C3A;
    --amber:#E3AA4A; --amber-bg:#3A2E12; --green:#5FC98A; --green-bg:#123A26; --red:#E97C7C; --red-bg:#3D1B1B; --grey:#9AA4B2; --grey-bg:#242C3A;
    --shadow:0 1px 2px rgba(0,0,0,.3), 0 8px 24px -12px rgba(0,0,0,.5);
  }
}
:root[data-theme="dark"]{
  --paper:#11161F; --surface:#171E29; --surface-2:#1D2532; --ink:#EAEEF5; --ink-soft:#B7C0CE; --ink-faint:#7E8898;
  --cobalt:#7C93F0; --cobalt-soft:#1E2A4D; --line:#2A3342; --line-soft:#242C3A;
  --amber:#E3AA4A; --amber-bg:#3A2E12; --green:#5FC98A; --green-bg:#123A26; --red:#E97C7C; --red-bg:#3D1B1B; --grey:#9AA4B2; --grey-bg:#242C3A;
  --shadow:0 1px 2px rgba(0,0,0,.3), 0 8px 24px -12px rgba(0,0,0,.5);
}
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;font-family:var(--font);background:var(--paper);color:var(--ink);font-variant-numeric:tabular-nums;line-height:1.5;-webkit-font-smoothing:antialiased}
h1,h2,h3,h4{font-weight:700;line-height:1.2;margin:0 0 .5em}
p{margin:0 0 1em}
a{color:var(--cobalt);text-decoration:none}
a:hover{text-decoration:underline}
button{font-family:inherit;cursor:pointer}
::selection{background:var(--cobalt-soft)}
.visually-hidden{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
:focus-visible{outline:2px solid var(--cobalt);outline-offset:2px;border-radius:4px}

/* ---------- shell layout ---------- */
#app{min-height:100vh;display:flex;flex-direction:column}
.topbar{position:sticky;top:0;z-index:40;background:var(--surface);border-bottom:1px solid var(--line);padding:0 max(16px,env(safe-area-inset-left)) 0 max(16px,env(safe-area-inset-right))}
.topbar-inner{max-width:var(--maxw);margin:0 auto;display:flex;align-items:center;gap:12px;height:56px}
.brand{display:flex;align-items:center;gap:8px;font-weight:800;font-size:15px;white-space:nowrap;color:var(--ink)}
.brand:hover{text-decoration:none}
.brand-mark{width:24px;height:24px;border-radius:6px;background:var(--cobalt);color:#fff;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:800}
.menu-btn{display:none;background:none;border:1px solid var(--line);border-radius:8px;width:36px;height:36px;align-items:center;justify-content:center;color:var(--ink)}
.tabbar{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;flex:1}
.tabbar::-webkit-scrollbar{display:none}
.tabbar a{flex:0 0 auto;padding:8px 10px;border-radius:8px;font-size:13px;font-weight:600;color:var(--ink-soft);white-space:nowrap}
.tabbar a:hover{background:var(--surface-2);text-decoration:none}
.tabbar a.active{color:var(--cobalt);background:var(--cobalt-soft)}
.top-actions{display:flex;align-items:center;gap:6px}
.icon-btn{background:none;border:1px solid var(--line);border-radius:8px;width:34px;height:34px;display:flex;align-items:center;justify-content:center;color:var(--ink-soft)}
.icon-btn:hover{background:var(--surface-2);color:var(--ink)}

.layout{max-width:var(--maxw);margin:0 auto;display:flex;gap:24px;width:100%;flex:1;padding:0 max(16px,env(safe-area-inset-left)) 40px max(16px,env(safe-area-inset-right))}
.rail{width:250px;flex:0 0 250px;padding-top:20px}
.rail-section{margin-bottom:20px}
.rail-title{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-faint);font-weight:700;margin:0 0 8px;padding:0 8px}
.rail a.rail-link{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:6px 8px;border-radius:8px;font-size:13px;color:var(--ink-soft);font-weight:500}
.rail a.rail-link:hover{background:var(--surface-2);text-decoration:none}
.rail a.rail-link.active{background:var(--cobalt-soft);color:var(--cobalt);font-weight:700}
.rail-bar{width:44px;height:4px;border-radius:2px;background:var(--line);overflow:hidden;flex:0 0 auto}
.rail-bar > span{display:block;height:100%;background:var(--cobalt)}
.rail-search{width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink);font-size:13px;margin-bottom:10px}
.rail-btn{width:100%;text-align:left;padding:7px 8px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink-soft);font-size:12px;font-weight:600}
.rail-btn:hover{background:var(--surface-2)}

main{flex:1;min-width:0;padding-top:20px}

/* ---------- generic components ---------- */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:20px;box-shadow:var(--shadow)}
.grid{display:grid;gap:16px}
.grid-2{grid-template-columns:repeat(2,1fr)}
.grid-3{grid-template-columns:repeat(3,1fr)}
.grid-4{grid-template-columns:repeat(4,1fr)}
@media (max-width:900px){.grid-2,.grid-3,.grid-4{grid-template-columns:1fr}}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:16px}
.stat .n{font-size:28px;font-weight:800;color:var(--ink)}
.stat .l{font-size:12px;color:var(--ink-faint);font-weight:600;text-transform:uppercase;letter-spacing:.04em}
.pill{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:999px;font-size:12px;font-weight:700;background:var(--grey-bg);color:var(--grey)}
.pill.cobalt{background:var(--cobalt-soft);color:var(--cobalt)}
.badge{display:inline-flex;align-items:center;font-size:11px;font-weight:700;padding:2px 8px;border-radius:6px;background:var(--surface-2);color:var(--ink-soft);border:1px solid var(--line)}
code.id{font-family:inherit;font-weight:700;font-size:11px;background:var(--surface-2);color:var(--cobalt);padding:2px 6px;border-radius:5px;border:1px solid var(--line)}
.disclaimer{font-size:12px;color:var(--ink-faint);border-top:1px solid var(--line);margin-top:32px;padding-top:16px}
.section-h{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin:28px 0 12px}
.section-h h2{margin:0}
.lede{font-size:16px;color:var(--ink-soft);max-width:70ch}
.scroll-x{overflow-x:auto;border:1px solid var(--line);border-radius:var(--radius);background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{text-align:left;padding:9px 12px;border-bottom:1px solid var(--line-soft);vertical-align:top}
th{background:var(--surface-2);font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:var(--ink-faint);position:sticky;top:0}
tr:last-child td{border-bottom:none}
.pillbar{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0 18px}
.pillbtn{padding:6px 12px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--ink-soft);font-size:12.5px;font-weight:600}
.pillbtn.active{background:var(--ink);color:var(--surface);border-color:var(--ink)}
:root[data-theme="dark"] .pillbtn.active,:root:not([data-theme="light"]) .pillbtn.active{background:var(--cobalt);border-color:var(--cobalt);color:#0b1220}
.crumbs{font-size:12px;color:var(--ink-faint);margin-bottom:10px}
.crumbs a{color:var(--ink-faint)}
.stagehead{display:flex;align-items:center;gap:20px;margin-bottom:8px}
.stagehead .numeral{font-size:88px;font-weight:800;line-height:1;color:transparent;-webkit-text-stroke:2px var(--cobalt);letter-spacing:-.04em}
.stagehead h1{margin:0;font-size:26px}
.stagehead .meta{color:var(--ink-faint);font-size:13px;font-weight:600}
.progressbar{height:6px;border-radius:3px;background:var(--line);overflow:hidden}
.progressbar>span{display:block;height:100%;background:var(--cobalt)}
.metaGrid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin:16px 0}
@media (max-width:800px){.metaGrid{grid-template-columns:repeat(2,1fr)}}
.metaGrid .k{font-size:11px;text-transform:uppercase;color:var(--ink-faint);font-weight:700;letter-spacing:.03em}
.metaGrid .v{font-size:13.5px;font-weight:600;margin-top:3px}

/* guided phase template */
.why{background:var(--surface-2);border:1px solid var(--line);border-radius:var(--radius);padding:16px 18px;margin:18px 0}
.step{border:1px solid var(--line);border-radius:var(--radius);background:var(--surface);margin-bottom:10px;overflow:hidden}
.step-head{width:100%;display:flex;align-items:center;gap:12px;padding:12px 14px;background:none;border:none;text-align:left;color:var(--ink)}
.step-num{flex:0 0 auto;width:26px;height:26px;border-radius:50%;background:var(--cobalt-soft);color:var(--cobalt);font-size:12px;font-weight:800;display:flex;align-items:center;justify-content:center}
.step-title{flex:1;font-weight:700;font-size:14px}
.step-chev{color:var(--ink-faint);transition:transform .15s}
.step.open .step-chev{transform:rotate(90deg)}
.step-body{display:none;padding:0 16px 16px 52px}
.step.open .step-body{display:block}
.step-how{font-size:13.5px;color:var(--ink-soft);margin:6px 0}
.step-how ul{margin:6px 0;padding-left:18px}
.step-sub{margin-top:10px;display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (max-width:700px){.step-sub{grid-template-columns:1fr}}
.step-sub .box{background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:10px 12px;font-size:12.5px}
.step-sub .box b{display:block;font-size:11px;text-transform:uppercase;color:var(--ink-faint);margin-bottom:4px;letter-spacing:.03em}
.step-practice{border-left:3px solid var(--green);background:var(--green-bg);padding:8px 10px;border-radius:6px;font-size:12.5px;margin-top:8px}
.step-mistake{border-left:3px solid var(--amber);background:var(--amber-bg);padding:8px 10px;border-radius:6px;font-size:12.5px;margin-top:8px}
.chiprow{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 10px;font-size:11px;font-weight:700;color:var(--ink-soft)}
.chip[data-state="in-progress"],.chip[data-state="passed"]{background:var(--green-bg);color:var(--green);border-color:transparent}
.chip[data-state="implemented"]{background:var(--green);color:#fff;border-color:transparent}
.chip[data-state="failed"]{background:var(--red-bg);color:var(--red);border-color:transparent}
.chip[data-state="unknown"],.chip[data-state="not-started"]{background:var(--grey-bg);color:var(--grey)}
.chip[data-state="untested"]{background:var(--amber-bg);color:var(--amber);border-color:transparent}
.chip[data-state="not-applicable"]{background:var(--grey-bg);color:var(--ink-faint);text-decoration:line-through}
.verify{background:var(--surface);border:1px dashed var(--cobalt);border-radius:var(--radius);padding:16px 18px;margin:18px 0}
.verify .row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px solid var(--line-soft)}
.verify .row:last-child{border-bottom:none}
.next-row{display:flex;justify-content:space-between;gap:12px;margin-top:20px}
.next-card{flex:1;border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px;background:var(--surface)}
.next-card .l{font-size:11px;color:var(--ink-faint);font-weight:700;text-transform:uppercase}

/* inner tabs */
.tabs2{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:18px;overflow-x:auto}
.tabs2 button{padding:9px 12px;background:none;border:none;border-bottom:2px solid transparent;font-size:13px;font-weight:700;color:var(--ink-faint);white-space:nowrap}
.tabs2 button.active{color:var(--cobalt);border-color:var(--cobalt)}

/* ring */
.ring-wrap{display:flex;align-items:center;gap:28px;flex-wrap:wrap}
svg.ring{width:220px;height:220px}
.ring seg{}
.ring-legend{display:flex;flex-direction:column;gap:6px;font-size:12.5px}
.ring-legend .li{display:flex;align-items:center;gap:8px}
.ring-legend .sw{width:10px;height:10px;border-radius:3px}

textarea.record{width:100%;min-height:110px;border:1px solid var(--line);border-radius:8px;padding:10px;font-family:inherit;font-size:13px;background:var(--surface);color:var(--ink);resize:vertical}
.warn{background:var(--amber-bg);color:var(--amber);border-radius:8px;padding:8px 12px;font-size:12px;font-weight:600;margin:8px 0}

.diagram-fig{margin:14px 0}
.diagram-fig figcaption{font-size:12px;color:var(--ink-faint);margin-top:8px}
svg.diagram{width:100%;height:auto;background:var(--surface-2);border:1px solid var(--line);border-radius:var(--radius)}

mark{background:var(--cobalt-soft);color:var(--ink);border-radius:3px;padding:0 2px}

@media (max-width:980px){
  .rail{position:fixed;top:56px;left:0;bottom:0;width:280px;background:var(--surface);border-right:1px solid var(--line);overflow-y:auto;transform:translateX(-100%);transition:transform .2s;z-index:39;padding:16px}
  .rail.open{transform:translateX(0)}
  .menu-btn{display:flex}
  .layout{display:block}
  .stagehead .numeral{font-size:56px}
}
@media print{
  .topbar,.rail,.menu-btn,.icon-btn,.pillbar,.tabs2{display:none!important}
  .step-body{display:block!important}
  body{background:#fff;color:#000}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div id="app">
  <header class="topbar">
    <div class="topbar-inner">
      <button class="menu-btn" id="menuBtn" aria-label="Toggle navigation" aria-expanded="false">☰</button>
      <a class="brand" href="#/apply"><span class="brand-mark">ES</span><span>Security Framework Guide</span></a>
      <nav class="tabbar" id="tabbar" role="tablist" aria-label="Pages"></nav>
      <div class="top-actions">
        <button class="icon-btn" id="themeBtn" aria-label="Toggle theme" title="Toggle theme">◐</button>
      </div>
    </div>
  </header>
  <div class="layout">
    <aside class="rail" id="rail"></aside>
    <main id="main" tabindex="-1"></main>
  </div>
</div>

<script>
/* =========================================================================
   ENTERPRISE IT SECURITY FRAMEWORK — INTERACTIVE BUILD GUIDE
   Single-file SPA. All content below is original synthetic material
   authored to match a specified structure. Nothing has been executed;
   tool names are illustrative examples only. See footer on every page.
   ========================================================================= */

/* ---------------------------------------------------------------------
   0. STORAGE — this guide is a step-by-step reference, not a progress
      tracker, so the only thing persisted locally is UI preference
      (theme, filter selections) and the fillable practice records.
   --------------------------------------------------------------------- */
const STORE_KEY = 'esfg_state_v1';
function loadStore(){
  try{ const raw = localStorage.getItem(STORE_KEY); return raw ? JSON.parse(raw) : {}; }
  catch(e){ return {}; }
}
function saveStore(){
  try{ localStorage.setItem(STORE_KEY, JSON.stringify(DB)); }catch(e){}
}
let DB = Object.assign({records:{}, theme:'auto', tabs:{}, route:'#/apply'}, loadStore());
function labelize(s){ return s.replace(/-/g,' ').replace(/\b\w/g,c=>c.toUpperCase()); }

/* ---------------------------------------------------------------------
   1. DATA — populated progressively below (Stage 1 fully authored;
      Stages 2-7, domains, disciplines, frameworks and tools follow the
      same shape and are appended in subsequent build passes).
   --------------------------------------------------------------------- */
const STAGES = [];      // filled by registerStage()
const STAGE_ACTIONS = []; // flat list, each {id, stageId, title, accountable, evidence, how:[]}
const DOMAINS = [];
const BASELINE_CONTROLS = [];
const DISCIPLINES = [];
const TOOLS = [];
const FRAMEWORKS = {};
const DIAGRAMS = {};
const GLOSSARY = [];
const POLICIES = [];
const DECISIONS = [];
const REQUIREMENTS = [];

function registerStage(s){ STAGES.push(s); s.actions.forEach(a=>STAGE_ACTIONS.push(Object.assign({stageId:s.id}, a))); }

/* ---- STAGE 1 : Establish authority, scope and ownership ---- */
registerStage({
  id:'S1', num:1, code:'S1', name:'Establish authority, scope and ownership',
  accountable:'Chief Information Security Officer (or equivalent accountable executive)',
  lead:'Security Governance Lead',
  why:'Nothing downstream is trustworthy if nobody can say, with a name attached, who owns the decision. This stage exists to fix accountability, scope and delegated authority before any control work starts — so later stages have a clear "who decides" instead of stalling on it.',
  inputs:['Executive sponsor mandate','Existing organisational chart','Any prior security policy documents','Regulatory / contractual obligations register'],
  standards:['Proposed standard: Security Governance Charter','Proposed standard: Delegated Authority Register'],
  externalRefs:['NIST CSF 2.0 — Govern (GV) function','ISO/IEC 27001:2022 clause 5 — Leadership'],
  greenfield:'Stand up the governance charter and RACI from a blank slate: appoint the accountable executive, draft the charter, and set delegated-authority thresholds before any tooling or hiring decisions are made.',
  existing:'Reconcile whatever accountability currently exists (informal or scattered) against the charter template; formally re-confirm or reassign ownership rather than assuming current owners already hold documented authority.',
  outputs:['Signed governance charter','Delegated authority register','Scope statement (in/out)','RACI skeleton for stages 1-7'],
  gate:'Gate S1→S2: the accountable executive has signed the charter, scope is documented and agreed, and at least one delegated decision-maker is named for each of the 15 baseline domains.',
  bestPractices:[
    {text:'Name one accountable executive, not a committee — committees diffuse accountability exactly where you need it sharpest.', stepRef:'S1.01'},
    {text:'Write delegated-authority thresholds in monetary/risk terms so delegates know exactly when to escalate.', stepRef:'S1.03'},
    {text:'Publish the scope statement including what is explicitly out of scope (see Requirements catalogue) so nobody assumes silent coverage.', stepRef:'S1.02'},
    {text:'Timebox this stage — governance work expands to fill available time; set a hard date for the charter signature.'},
    {text:'Involve legal/compliance early on regulatory obligations rather than retrofitting them into an already-signed charter.', stepRef:'S1.05'},
    {text:'Store the charter and RACI where every subsequent stage owner can find them without asking — a shared, version-controlled location beats an email attachment.'}
  ],
  mistakes:[
    {text:'Treating the charter as a formality and skipping executive sign-off — later stage gates then have nothing to point back to.', stepRef:'S1.01'},
    {text:'Defining scope so broadly it includes physical/OT/IoT without resourcing them, instead of explicitly deferring per the Requirements catalogue.', stepRef:'S1.02'},
    {text:'Leaving delegated authority verbal — the first real incident then stalls on "who can approve this?"', stepRef:'S1.03'}
  ],
  reqs:[
    {id:'REQ-1.1', text:'A named accountable executive exists for the security framework.', accept:'Charter document names one individual with title, signed and dated.'},
    {id:'REQ-1.2', text:'Scope is documented, including explicit exclusions.', accept:'Scope statement lists in-scope domains and out-of-scope items with rationale.'},
    {id:'REQ-1.3', text:'Delegated authority is defined for each baseline domain.', accept:'Delegated authority register has one named delegate per domain code.'},
    {id:'REQ-1.4', text:'A RACI skeleton exists for all seven stages.', accept:'RACI table published covering Responsible/Accountable/Consulted/Informed per stage.'},
    {id:'REQ-1.5', text:'Regulatory and contractual obligations are catalogued.', accept:'Obligations register cross-referenced to at least one accountable owner each.'}
  ],
  diagram:'d-s1-governance',
  actions:[
    {id:'S1.01', title:'Appoint the accountable executive', accountable:'Executive sponsor', evidence:'Signed appointment memo or board minute',
      how:['Identify a single executive (e.g. CISO, Head of IT) who will hold accountability — not a working group.','Get written, dated sign-off from the executive sponsor confirming the appointment.','Record the appointment in the governance charter and circulate it to all stage leads.']},
    {id:'S1.02', title:'Draft and agree the scope statement', accountable:'Governance Lead', evidence:'Approved scope statement document',
      how:['List every service, environment and data type intended to be in scope.','Explicitly list deferred items (physical security, OT, IoT — see Requirements catalogue) with the reason for deferral.','Circulate for review to legal, IT operations and business unit leads before finalising.']},
    {id:'S1.03', title:'Define delegated authority thresholds', accountable:'Accountable executive', evidence:'Delegated authority register',
      how:['For each of the 15 baseline domains, name one delegate empowered to make day-to-day decisions.','State the monetary or risk threshold above which a decision must escalate to the accountable executive.','Confirm each delegate in writing and record acceptance.']},
    {id:'S1.04', title:'Build the RACI skeleton for all seven stages', accountable:'Governance Lead', evidence:'RACI matrix (stage × role)',
      how:['List every role likely to touch the framework: executive, delegates, IT operations, security engineering, legal, providers.','Assign Responsible/Accountable/Consulted/Informed per stage at a high level — detail is refined per stage later.','Publish the RACI alongside the charter.']},
    {id:'S1.05', title:'Catalogue regulatory and contractual obligations', accountable:'Legal / Compliance lead', evidence:'Obligations register',
      how:['List applicable regulation, industry codes and material customer/supplier contract security clauses.','Map each obligation to an accountable owner and, where possible, to a baseline domain.','Flag obligations with a hard compliance date for prioritisation in Stage 3.']},
    {id:'S1.06', title:'Identify existing security-relevant policies', accountable:'Governance Lead', evidence:'Policy inventory',
      how:['Search for any existing security, acceptable-use, data-handling or incident policies, however informal.','Record their status (current, stale, superseded) rather than assuming they are still authoritative.','Feed the inventory into the Standards & Policies page for Stage 3 reconciliation.']},
    {id:'S1.07', title:'Confirm provider and outsourcing boundaries', accountable:'Accountable executive', evidence:'Provider boundary statement',

    {id:'S1.08', title:'Set the urgent-protection parallel track', accountable:'Governance Lead', evidence:'Urgent protection charter note',
      how:['Identify any immediate, known high-risk exposures that cannot wait for the full seven-stage sequence.','Charter a short parallel track with its own lightweight authority so urgent fixes are not blocked on governance completion.','Record what "urgent" means for this organisation so the track is not misused for ordinary work.']},
    {id:'S1.09', title:'Establish the evidence and record-keeping approach', accountable:'Governance Lead', evidence:'Evidence handling note',
      how:['Decide where control records, practice records and evidence will be stored and who can access them.','Set the rule that documented, configured, tested and maintained are four distinct states — never conflate them (see Overview principles).','Confirm the storage location protects any sensitive material appropriately.']},
    {id:'S1.10', title:'Agree the standards-naming convention', accountable:'Governance Lead', evidence:'Standards register skeleton',
      how:['Agree a naming and numbering convention for proposed organisational standards (e.g. domain-code prefixed).','Create an empty standards register ready for Stage 3 population.','Confirm the convention with delegates so future documents are consistent.']},
    {id:'S1.11', title:'Communicate the charter to the organisation', accountable:'Accountable executive', evidence:'Communication record',
      how:['Prepare a short communication explaining the charter, scope and delegated authority to affected teams.','Send it from the accountable executive, not delegated staff, to signal authority.','Store a copy of the communication as evidence of organisational awareness.']},
    {id:'S1.12', title:'Confirm the Stage 1 gate', accountable:'Accountable executive', evidence:'Signed gate confirmation',

registerStage({
  id:'S2', num:2, code:'S2', name:'Discover services, assets, data and gaps',
  accountable:'Chief Information Security Officer',
  lead:'Security Architecture Lead',
  why:'You cannot protect what you cannot see. This stage builds the inventory of services, assets, data flows and identities so that Stage 3 can set requirements against reality rather than assumption, and so gaps are found before they are exploited rather than after.',
  inputs:['Signed governance charter (Stage 1)','Existing CMDB / asset registers, if any','Network diagrams','Cloud tenant and subscription list','Data classification scheme, if any'],
  standards:['Proposed standard: Asset & Service Inventory Standard','Proposed standard: Data Classification Standard'],

  greenfield:'Build the inventory alongside the architecture as services are designed — there is little legacy to discover, so focus discovery on cloud tenants, identity providers and any inherited supplier connections.',
  existing:'Run structured discovery against live environments: automated asset/cloud discovery tools, directory exports, data flow interviews with service owners, and reconciliation against any existing (likely incomplete) CMDB.',

    {text:'Map identity providers and trust relationships explicitly, including any federation to SaaS or partner tenants.', stepRef:'S2.07'},
    {text:'Record what you cannot find as a gap, not a silent omission — an unknown asset is itself a finding.'},
    {text:'Reconcile discovery output against the Stage 1 scope statement to catch shadow IT outside the intended boundary.', stepRef:'S2.09'},

  mistakes:[

    {text:'Treating the gap register as a one-time exercise rather than an input that Stage 3 will directly consume.', stepRef:'S2.14'}

  reqs:[

    {id:'REQ-2.2', text:'Data flows are mapped with classification for the synthetic worked service.', accept:'Data flow map shows CUSTOMER_A/CUSTOMER_B isolation points end to end.'},
    {id:'REQ-2.3', text:'Identity providers and trust relationships are inventoried.', accept:'Identity inventory lists every IdP, federation and workload identity source in scope.'},
    {id:'REQ-2.4', text:'A gap register exists mapped to all 15 baseline domains.', accept:'Gap register has at least one entry (including "no gap found") per domain code.'},
    {id:'REQ-2.5', text:'Discovery output is reconciled against the Stage 1 scope statement.', accept:'Reconciliation note lists any shadow-IT or out-of-scope findings and their disposition.'}

  diagram:'d-s2-worked-service',
  actions:[
    {id:'S2.01', title:'Select and deploy discovery tooling', accountable:'Security Architecture Lead', evidence:'Tooling deployment record',
      how:['Choose discovery methods appropriate to each environment: cloud-native inventory APIs, EDR agent inventories, directory exports, network scanning.','Deploy read-only discovery access — avoid intrusive scanning without change-control sign-off.','Confirm coverage against the known environment list before relying on results.']},
    {id:'S2.02', title:'Inventory services and hosting environments', accountable:'Security Architecture Lead', evidence:'Service inventory export',
      how:['List every service in scope, its hosting environment (cloud, on-prem, SaaS) and its owner.','Cross-check against billing/subscription records to catch unlisted environments.','Flag any service without a named owner as a gap.']},
    {id:'S2.03', title:'Inventory compute, network and endpoint assets', accountable:'Infrastructure lead', evidence:'Asset inventory export',
      how:['Pull asset lists from EDR, MDM, hypervisor and cloud consoles.','Reconcile counts across sources — large discrepancies usually indicate missing agents or shadow assets.','Record asset criticality where known, to prioritise Stage 3 baseline application.']},
    {id:'S2.04', title:'Inventory identity providers and directories', accountable:'IAM lead', evidence:'Identity inventory',
      how:['List every directory, identity provider and federation trust (including SaaS admin consoles with local accounts).','Note which identities are workforce, customer, or workload (machine) identities.','Flag any directory with no defined owner.']},
    {id:'S2.05', title:'Establish or confirm the data classification scheme', accountable:'Data governance lead', evidence:'Data classification standard',
      how:['Define a small number of classification tiers (e.g. public, internal, confidential, restricted).','Assign a default tier to unclassified data pending explicit classification.','Publish the scheme so Stage 2 data-flow mapping can apply it consistently.']},
    {id:'S2.06', title:'Map data flows for in-scope services', accountable:'Security Architecture Lead', evidence:'Data flow diagrams',
      how:['Interview service owners to trace data from entry point to storage to any downstream consumer.','Include middleware, queues and batch/reconciliation jobs, not just front-end paths.','Classify each flow using the Stage 2.05 scheme and note any cross-border transfer.']},
    {id:'S2.07', title:'Trace the synthetic worked service data flow', accountable:'Security Architecture Lead', evidence:'Worked-service flow diagram',
      how:['Trace CUSTOMER_A submitting REQUEST_A from the cloud portal through the on-prem queue and processing/database layer to the independent SaaS case management system.','Confirm and document the isolation point that prevents CUSTOMER_B from ever reading CUSTOMER_A\'s request.','Record the reconciled status flow as the running example carried through later stages.']},
    {id:'S2.08', title:'Inventory external and supplier connections', accountable:'Security Architecture Lead', evidence:'Supplier connectivity register',
      how:['List every inbound/outbound connection to suppliers, partners and managed providers.','Note the authentication method and data classification carried on each connection.','Flag any connection lacking a named business owner.']},
    {id:'S2.09', title:'Reconcile discovery against the Stage 1 scope statement', accountable:'Governance Lead', evidence:'Reconciliation note',
      how:['Compare discovered assets/services against the agreed scope statement.','Log anything found outside scope (shadow IT) as a decision item: bring into scope, formally exclude, or decommission.','Route decisions back to the accountable executive where they change the agreed scope.']},
    {id:'S2.10', title:'Assess current control state per domain', accountable:'Domain delegates', evidence:'Current-state assessment per domain',
      how:['For each of the 15 baseline domains, record what controls already exist, informally or formally.','Distinguish documented from configured from tested — do not assume a policy document means the control is active.','Capture this as the baseline for the Stage 2 gap register.']},
    {id:'S2.11', title:'Identify quick-win risks requiring urgent-track attention', accountable:'Security Architecture Lead', evidence:'Urgent-track referral log',
      how:['Flag any discovery finding that represents immediate, material exposure (e.g. internet-exposed admin interface).','Refer these into the Stage 1 urgent-protection parallel track rather than waiting for the full baseline rollout.','Confirm each referral is acknowledged by the relevant domain delegate.']},
    {id:'S2.12', title:'Assign inventory ownership and refresh cadence', accountable:'Governance Lead', evidence:'Inventory ownership record',
      how:['Name an owner responsible for keeping each inventory (service, asset, identity, data flow) current.','Set a refresh cadence (e.g. quarterly) and a trigger-based refresh on major change.','Record the cadence in the proposed Asset & Service Inventory Standard.']},
    {id:'S2.13', title:'Build the domain gap register', accountable:'Security Architecture Lead', evidence:'Gap register (15 domains)',
      how:['For each domain, compare current-state assessment (S2.10) against the intended baseline control list.','Record explicit "no gap found" entries as well as gaps — silence is not evidence of adequacy.','Prioritise gaps using discovered asset criticality and any urgent-track referrals.']},
    {id:'S2.14', title:'Confirm the Stage 2 gate', accountable:'Accountable executive', evidence:'Signed gate confirmation',
      how:['Verify inventory coverage against the Stage 1 scope statement.','Confirm the worked-service data flow and gap register are complete.','Sign the gate confirmation and unlock Stage 3.']}
  ]
});

/* ---- STAGE 3 : Approve requirements and the minimum baseline ---- */
registerStage({
  id:'S3', num:3, code:'S3', name:'Approve requirements and the minimum baseline',
  accountable:'Chief Information Security Officer',
  lead:'Security Governance Lead',
  why:'Discovery tells you what exists; this stage decides what "good enough" means and gets it formally approved, so that every later implementation decision can be checked against an agreed baseline instead of individual opinion.',
  inputs:['Gap register (Stage 2)','Requirements catalogue draft','Regulatory obligations register (Stage 1)','Existing policy inventory (Stage 1)'],
  standards:['Proposed standard: Minimum Baseline Control Standard','Proposed standard: Exception Management Standard'],
  externalRefs:['ISO/IEC 27001:2022 Annex A control catalogue','NIST SP 800-53 Rev. 5 control baselines'],
  greenfield:'Adopt the full 77-control baseline from the outset as a design constraint — it is cheaper to build to the baseline than to retrofit it.',
  existing:'Work through the Stage 2 gap register domain by domain, approving either remediation or a time-bound, approved exception for each identified gap — an approved exception is never treated as a passed test.',
  outputs:['Approved requirements catalogue (BR/GR/FR/OR/AR/NFR)','Approved minimum baseline (77 controls, 15 domains)','Exception register','Updated standards register'],
  gate:'Gate S3→S4: the requirements catalogue and baseline are formally approved by the accountable executive, and every Stage 2 gap has either an approved remediation plan or an approved, time-bound exception.',
  bestPractices:[
    {text:'Approve the baseline as a whole document, not control-by-control — piecemeal approval invites scope creep and inconsistency.', stepRef:'S3.11'},
    {text:'Give every exception an expiry date and a named owner — an exception with no review date becomes permanent by default.', stepRef:'S3.09'},
    {text:'Keep requirements vendor-neutral in this stage; tool selection belongs in Stage 4/5, not here.'},
    {text:'Cross-reference each approved control to the regulatory obligations register so compliance mapping is not a separate exercise later.', stepRef:'S3.04'},
    {text:'Publish the control-record field list now so evidence capture is consistent from Stage 5 onward.', stepRef:'S3.12'},
    {text:'Make clear that missing targets (e.g. an undefined retention period) are open decisions, not silent defaults.'}
  ],
  mistakes:[
    {text:'Treating an approved exception as equivalent to a passed test — it is a documented risk acceptance, not evidence of control effectiveness.', stepRef:'S3.09'},
    {text:'Approving requirements that are actually tool-specific, closing off legitimate architecture choices in Stage 4.', stepRef:'S3.03'},
    {text:'Leaving thresholds, dates and jurisdictions as vague placeholders instead of flagging them explicitly as local adoption inputs.', stepRef:'S3.13'}
  ],
  reqs:[
    {id:'REQ-3.1', text:'The requirements catalogue is approved by the accountable executive.', accept:'Signed approval record referencing the specific catalogue version.'},
    {id:'REQ-3.2', text:'The 77-control minimum baseline is approved across all 15 domains.', accept:'Signed baseline document with per-domain control counts matching the published totals.'},
    {id:'REQ-3.3', text:'Every Stage 2 gap has a disposition.', accept:'Gap register shows remediation plan or approved exception for 100% of entries.'},
    {id:'REQ-3.4', text:'Exceptions are time-bound and owned.', accept:'Exception register entries each have an expiry date and named owner.'},
    {id:'REQ-3.5', text:'The control-record field list is published.', accept:'Control-record template available and referenced by Stage 4 design work.'}
  ],
  diagram:'d-s3-baseline-gate',
  actions:[
    {id:'S3.01', title:'Draft the requirements catalogue', accountable:'Governance Lead', evidence:'Draft requirements catalogue',
      how:['Group requirements into BR (business), GR (governance), FR (functional security), OR (operational), AR (assurance), NFR (non-functional).','Write each requirement as a testable statement with acceptance criteria, not an aspiration.','Cross-reference each requirement to the stage(s) that deliver it.']},
    {id:'S3.02', title:'Confirm scope in/out for physical, OT and IoT', accountable:'Governance Lead', evidence:'Scope decision record',
      how:['Confirm physical security, OT and IoT remain deferred per the Stage 1 scope statement.','Confirm hosting, power, connectivity and supplier interfaces are explicitly kept in scope where they affect in-scope services.','Record the rationale so the decision can be revisited deliberately rather than by drift.']},
    {id:'S3.03', title:'Keep baseline controls vendor-neutral', accountable:'Security Architecture Lead', evidence:'Vendor-neutral control wording review',
      how:['Review each draft control statement for embedded product names or tool-specific assumptions.','Replace with outcome-based wording; move any illustrative tool references to the separate Tool catalogue.','Confirm reviewers understand documented ≠ configured ≠ tested ≠ maintained as four distinct states.']},
    {id:'S3.04', title:'Map controls to regulatory obligations', accountable:'Legal / Compliance lead', evidence:'Obligation-to-control map',
      how:['Cross-reference the Stage 1 obligations register to specific baseline controls.','Flag obligations with no mapped control as a gap requiring a new or adjusted control.','Note that this mapping is indicative, not a certified compliance mapping.']},
    {id:'S3.05', title:'Walk the gap register domain by domain', accountable:'Domain delegates', evidence:'Gap disposition log',
      how:['For each Stage 2 gap, decide: remediate now, remediate on a schedule, or request an exception.','Record the decision-maker and rationale for each disposition.','Escalate any gap above the delegate\'s authority threshold to the accountable executive.']},
    {id:'S3.06', title:'Assess urgent-track gaps first', accountable:'Domain delegates', evidence:'Urgent-track disposition',
      how:['Prioritise dispositions for gaps already referred to the urgent-protection track in Stage 2.','Confirm interim mitigations are in place while the full baseline control is rolled out.','Record interim mitigation evidence separately from the eventual baseline control evidence.']},
    {id:'S3.07', title:'Draft the exception request template', accountable:'Governance Lead', evidence:'Exception request template',
      how:['Include fields for control reference, business justification, compensating control, expiry date and owner.','Require accountable-executive sign-off above the domain delegate\'s authority threshold.','Store approved exceptions where they are visible to the relevant Stage 5/6 implementers.']},
    {id:'S3.08', title:'Review and approve individual exception requests', accountable:'Accountable executive / domain delegates', evidence:'Approved exception records',
      how:['Review each exception request against the template fields.','Explicitly record that an approved exception is a risk acceptance, not a passed test.','Set a calendar reminder ahead of each exception\'s expiry date for re-review.']},
    {id:'S3.09', title:'Publish the exception register', accountable:'Governance Lead', evidence:'Exception register',
      how:['Consolidate all approved exceptions into a single register with status, owner and expiry.','Make the register visible to Stage 7 assurance activity.','Review the register at a fixed cadence, not only at individual expiry dates.']},
    {id:'S3.10', title:'Reconcile against existing policy inventory', accountable:'Governance Lead', evidence:'Policy reconciliation note',
      how:['Compare the Stage 1 policy inventory against the new requirements catalogue and baseline.','Mark existing policies as superseded, retained, or requiring update.','Update the standards register to reflect the reconciled position.']},
    {id:'S3.11', title:'Seek formal approval of the full baseline', accountable:'Accountable executive', evidence:'Signed baseline approval',
      how:['Present the complete requirements catalogue and 77-control baseline as a single package for approval.','Avoid approving individual controls in isolation, to preserve consistency across domains.','Record the approval with a version number for future change tracking.']},
    {id:'S3.12', title:'Publish the control-record field list', accountable:'Governance Lead', evidence:'Control-record template',
      how:['Define the fields every control record must capture (see the Requirements page for the full field list).','Circulate the template to domain delegates ahead of Stage 4/5 implementation.','Confirm the template distinguishes implementation state from validation state.']},
    {id:'S3.13', title:'Flag open local-adoption inputs', accountable:'Governance Lead', evidence:'Open decisions log',

/* ---- STAGE 4 : Design the target architecture and operating model ---- */
registerStage({
  id:'S4', num:4, code:'S4', name:'Design the target architecture and operating model',
  accountable:'Chief Information Security Officer',
  lead:'Security Architecture Lead',
  why:'An approved baseline is a set of outcomes, not a blueprint. This stage turns it into a concrete target architecture and operating model — including how threats against the design are found and mitigated before a single control is built — so Stage 5 implements against a design, not improvisation.',
  inputs:['Approved requirements catalogue and baseline (Stage 3)','Current-state asset and data-flow inventory (Stage 2)','Open local-adoption decisions log (Stage 3)'],
  standards:['Proposed standard: Reference Architecture Standard','Proposed standard: Threat Modelling Standard'],
  externalRefs:['NIST CSF 2.0 — Protect (PR) function','OWASP Application Security Verification Standard (ASVS)'],
  greenfield:'Design the target architecture directly — zones, identity paths and control placement can be set correctly from day one without migration constraints.',
  existing:'Design a target architecture and an explicit current-to-target migration path; do not silently assume the current architecture already matches intended zoning or control placement.',
  outputs:['Target reference architecture diagram','Threat model for the worked service','Architecture decision records','Operating model (who runs what, day to day)'],
  gate:'Gate S4→S5: the target architecture and threat model are reviewed and signed off, every architecture decision is recorded against one of the 14 agreed decisions, and the operating model names who runs each control day to day.',
  bestPractices:[
    {text:'Draw the current state and the target state side by side — gaps between them become the Stage 5 implementation backlog directly.', stepRef:'S4.02'},
    {text:'Run the threat model against the actual worked-service flow (CUSTOMER_A/CUSTOMER_B), not a generic abstract system — abstractions hide the exact isolation failure you most need to catch.', stepRef:'S4.05'},
    {text:'Record every material architecture choice as a decision with a rationale, even when the choice seems obvious at the time.', stepRef:'S4.08'},
    {text:'No firewall, WAF or API gateway placement decision should be treated as replacing application-level authorisation — record that explicitly in the architecture.', stepRef:'S4.04'},
    {text:'Name an operating owner for every control in the target architecture before Stage 5 begins — an unowned control will not get implemented reliably.', stepRef:'S4.11'},
    {text:'Treat post-quantum cryptography as an inventory-and-track item now, not a retrofit later — record which algorithms and certificates would need to change.'}
  ],
  mistakes:[
    {text:'Designing the architecture without revisiting the threat model when a design detail changes.', stepRef:'S4.05'},
    {text:'Assuming a WAF or API gateway means application authorisation checks can be skipped or weakened.', stepRef:'S4.04'},
    {text:'Leaving the operating model implicit ("infrastructure team will sort it out") instead of naming a control owner.', stepRef:'S4.11'}
  ],
  reqs:[
    {id:'REQ-4.1', text:'A target reference architecture is documented.', accept:'Architecture diagram covers all zones used by the worked service and is reviewed by the Security Architecture Lead.'},
    {id:'REQ-4.2', text:'A threat model exists for the worked service.', accept:'Threat model lists assets, entry points, threats per element, mitigations and residual risk.'},
    {id:'REQ-4.3', text:'Architecture decisions are recorded.', accept:'Each material decision is logged against one of the 14 agreed decisions with rationale.'},
    {id:'REQ-4.4', text:'The operating model names an owner per control.', accept:'Operating model table has no blank "owner" cell for any in-scope control.'},
    {id:'REQ-4.5', text:'The secure-SDLC mapping is documented for Discipline 2.', accept:'SDLC-to-pipeline-to-framework-stage diagram published and reviewed.'}
  ],
  diagram:'d-s4-edge-to-data',
  actions:[
    {id:'S4.01', title:'Confirm architecture principles', accountable:'Security Architecture Lead', evidence:'Architecture principles note',
      how:['Restate default-deny, least-privilege and zero-trust-style principles as design constraints for this build.','Confirm principles do not conflict with any approved exception from Stage 3.','Publish principles alongside the reference architecture.']},
    {id:'S4.02', title:'Draw current-state vs target-state architecture', accountable:'Security Architecture Lead', evidence:'Current vs target architecture diagrams',
      how:['Lay out the current architecture using Stage 2 discovery data.','Lay out the target architecture using the approved baseline and principles.','Highlight the delta explicitly — this delta becomes the Stage 5 backlog.']},
    {id:'S4.03', title:'Define zones and trust boundaries', accountable:'Network architect', evidence:'Zone model',
      how:['Define zones (Internet, Edge, Cloud, On-premises, SaaS) matching the worked-service model from Stage 2.','Document allowed traffic between zones as a flow matrix.','Confirm default-deny, including egress, is the starting position for every zone boundary.']},
    {id:'S4.04', title:'Place edge, WAF and API management controls', accountable:'Security Architecture Lead', evidence:'Edge control placement diagram',
      how:['Position firewall, WAF, and API management layers ahead of application and data tiers per the worked-service flow.','Document explicitly that these layers do not replace application-level authorisation checks.','Note the origin-lock requirement so the application is not reachable by bypassing the edge layer.']},
    {id:'S4.05', title:'Run the STRIDE-style threat model on the worked service', accountable:'Security Architecture Lead + Application security lead', evidence:'Threat model document',
      how:['List assets (REQUEST_A, customer identity, case status) and entry points (portal, queue, API, SaaS integration).','For each element, step through Spoofing, Tampering, Repudiation, Information disclosure, Denial of service, Elevation of privilege.','Record a mitigation and residual risk rating for each identified threat, using a tool such as Threat Dragon to structure the exercise.','Pay particular attention to the CUSTOMER_A/CUSTOMER_B isolation boundary — this is the threat model\'s primary test case.']},
    {id:'S4.06', title:'Design identity and access architecture', accountable:'IAM lead', evidence:'Identity architecture diagram',
      how:['Design separate identity paths for workforce, customer and workload identities.','Specify phishing-resistant MFA for administrative access and just-in-time elevation for privileged roles.','Document break-glass access procedures separately, with tightened monitoring.']},
    {id:'S4.07', title:'Design data protection and key management architecture', accountable:'Data governance lead', evidence:'Data protection architecture note',
      how:['Specify encryption in transit and at rest per the Cryptography & key management discipline reference profile.','Decide key management placement (managed KMS vs self-hosted vault) as an architecture decision.','Record retention and legal-hold handling for the worked service\'s case data.']},
    {id:'S4.08', title:'Record architecture decisions', accountable:'Security Architecture Lead', evidence:'Architecture decision records',
      how:['Log each material choice (e.g. WAF placement, key management model, identity federation approach) as a decision record.','Reference the relevant agreed decision ID from the Requirements page where applicable.','Circulate decision records for review before Stage 5 implementation starts.']},
    {id:'S4.09', title:'Map the secure-SDLC lifecycle to pipeline stages', accountable:'DevSecOps lead', evidence:'SDLC mapping diagram',
      how:['Map plan → design → build → test → release → operate against concrete CI/CD pipeline gates (secret scan, SAST, SCA, IaC scan, image scan, sign, deploy policy, runtime monitoring).','Map each SDLC phase to the framework stage it corresponds to (e.g. "design" aligns to this stage, "operate" aligns to Stage 6).','Publish the mapping on the Discipline 2 page as the reference diagram for developers.']},
    {id:'S4.10', title:'Design the CI/CD supply-chain control chain', accountable:'DevSecOps lead', evidence:'CI/CD supply-chain diagram',
      how:['Sequence pre-commit secret scanning, PR-time SAST/SCA/IaC scanning, build-time image scanning and SBOM generation, artifact signing, deploy-time policy gating and runtime monitoring.','Name an illustrative tool example at each gate from the Tool catalogue.','Specify the evidence artefact produced at each gate (scan report, SBOM, signature, policy decision log).']},
    {id:'S4.11', title:'Define the operating model', accountable:'Security Architecture Lead', evidence:'Operating model table',
      how:['For every control in the target architecture, name who operates it day to day and who is accountable if it fails.','Distinguish internal team ownership from managed-provider operation, noting the provider never holds accountability.','Cross-reference the operating model to the RACI published in Stage 1.']},
    {id:'S4.12', title:'Review architecture against the approved baseline', accountable:'Domain delegates', evidence:'Baseline conformance review',
      how:['Check the target architecture satisfies every applicable baseline control from Stage 3.','Flag any control the architecture cannot yet satisfy as a Stage 5 implementation risk.','Record the review outcome per domain.']},
    {id:'S4.13', title:'Resolve open local-adoption decisions relevant to design', accountable:'Accountable executive', evidence:'Resolved decisions log',
      how:['Work through the Stage 3 open-decisions log for items that block architecture sign-off (e.g. undefined retention period).','Record resolutions or an explicit deferral with owner and date.','Carry any remaining open items forward into Stage 5 with a clear flag.']},
    {id:'S4.14', title:'Confirm the Stage 4 gate', accountable:'Accountable executive', evidence:'Signed gate confirmation',
      how:['Confirm the architecture, threat model and operating model are complete and reviewed.','Confirm every control in the target architecture has a named operating owner.','Sign the gate confirmation and unlock Stage 5.']}
  ]
});

/* ---- STAGE 5 : Implement, pilot, test and expand ---- */
registerStage({
  id:'S5', num:5, code:'S5', name:'Implement, pilot, test and expand',
  accountable:'Chief Information Security Officer',
  lead:'Security Engineering Lead',
  why:'Design intent only becomes real once it is built, piloted on a limited scope, tested against both success and failure cases, and then rolled out wider — with urgent protection running in parallel throughout rather than waiting for the full rollout to finish.',
  inputs:['Target architecture and operating model (Stage 4)','Approved baseline (Stage 3)','Urgent-track referrals (Stages 1-4)'],
  standards:['Proposed standard: Release and Change Control Standard','Proposed standard: Pilot Acceptance Standard'],
  externalRefs:['NIST SP 800-53 Rev. 5 control implementation guidance','CIS Controls v8 — Implementation Groups (IG1-3)'],
  greenfield:'Build directly to the target architecture; pilot on the first live service before expanding to the full estate.',
  existing:'Converge greenfield builds and existing-environment remediation onto the same target architecture, running a repair loop for anything that fails pilot testing before wider waves proceed.',
  outputs:['Implemented controls with control records','Pilot test results (positive, negative, failure)','Wave rollout plan and status','Updated exception/urgent-track status'],
  gate:'Gate S5→S6: the pilot service passes its acceptance tests (including negative and failure cases), controls implemented in the pilot have populated control records, and a wave plan exists for remaining scope.',
  bestPractices:[
    {text:'Pilot on one real, representative service before wide rollout — a pilot that only exercises a toy example will miss integration surprises.', stepRef:'S5.03'},
    {text:'Test the negative and failure case explicitly, not just the happy path — a control that only passes its positive test is unproven.', stepRef:'S5.05'},
    {text:'A backup job succeeding is not a recovery test — only a successful restore, exercised end to end, counts as a recovery test.', stepRef:'S5.09'},
    {text:'Run urgent-protection fixes in parallel with the staged rollout — do not let urgent items wait behind the full wave sequence.'},
    {text:'Populate the control record at implementation time, not retrospectively — memory of configuration detail fades fast.', stepRef:'S5.06'},
    {text:'Keep a visible repair loop for pilot failures so a failed test drives a fix, not a silent retry of the same test.', stepRef:'S5.07'}
  ],
  mistakes:[
    {text:'Declaring a control "implemented" once configured, without running the positive, negative and failure tests defined for it.', stepRef:'S5.05'},
    {text:'Expanding to later waves before the pilot\'s failed tests are actually fixed and re-tested.', stepRef:'S5.07'},
    {text:'Recording a scheduled backup job as evidence of a tested recovery capability.', stepRef:'S5.09'}
  ],
  reqs:[
    {id:'REQ-5.1', text:'The pilot service is fully implemented against the target architecture.', accept:'Control records exist for every baseline control applicable to the pilot service.'},
    {id:'REQ-5.2', text:'Positive, negative and failure tests are run and recorded for the pilot.', accept:'Test records show all three test types with expected vs actual outcomes.'},
    {id:'REQ-5.3', text:'A wave rollout plan exists for remaining scope.', accept:'Wave plan lists services/order/target dates covering full Stage 1 scope.'},
    {id:'REQ-5.4', text:'Urgent-track items are resolved or have a documented interim mitigation.', accept:'Urgent-track log shows disposition for every referral raised since Stage 1.'},
    {id:'REQ-5.5', text:'Recovery capability is tested, not just backup jobs scheduled.', accept:'Recovery test record shows an actual restore exercised end to end.'}
  ],
  diagram:'d-s5-rollout',
  actions:[
    {id:'S5.01', title:'Finalise the pilot scope', accountable:'Security Engineering Lead', evidence:'Pilot scope statement',
      how:['Select one representative in-scope service for the pilot — ideally one exercising several baseline domains at once.','Confirm pilot scope with the accountable executive and affected service owner.','Set a pilot acceptance date.']},
    {id:'S5.02', title:'Stand up shared foundations first', accountable:'Security Engineering Lead', evidence:'Foundations build record',
      how:['Implement shared identity, logging and network foundations before service-specific controls, since later waves depend on them.','Confirm foundations meet the relevant baseline controls (GOV, INV, IAM, NET) before layering service controls on top.','Record foundation control records ahead of the pilot.']},
    {id:'S5.03', title:'Implement pilot controls against the target architecture', accountable:'Security Engineering Lead + domain delegates', evidence:'Pilot implementation log',
      how:['Work through the target architecture control by control for the pilot service.','Cycle each control\'s Build state from not-started to in-progress to implemented as work proceeds.','Flag any control that cannot be implemented as designed as an architecture deviation for Stage 4 review.']},
    {id:'S5.04', title:'Build the delivery-protection controls', accountable:'DevSecOps lead', evidence:'CI/CD control implementation record',
      how:['Implement the CI/CD supply-chain gates designed in Stage 4 (secret scan, SAST, SCA, IaC scan, image scan, SBOM, signing, deploy policy).','Confirm each gate blocks a deliberately-introduced test failure before accepting it as working.','Record the evidence artefact each gate produces.']},
    {id:'S5.05', title:'Run positive, negative and failure tests', accountable:'Security Engineering Lead', evidence:'Test result records',
      how:['Positive test: confirm the control behaves correctly under expected use (e.g. authorised request succeeds).','Negative test: confirm the control correctly blocks an unauthorised or malformed case (e.g. CUSTOMER_B cannot read CUSTOMER_A\'s request).','Failure test: confirm behaviour when the control itself fails or is unavailable (e.g. fail-closed vs fail-open behaviour), and record which was intended.']},
    {id:'S5.06', title:'Populate control records', accountable:'Domain delegates', evidence:'Populated control records',
      how:['Complete the control-record fields published in Stage 3 for every implemented pilot control.','Separate implementation state (documented/configured) from validation state (tested/maintained) in the record.','Store records where Stage 7 assurance activity can access them.']},
    {id:'S5.07', title:'Run the pilot repair loop', accountable:'Security Engineering Lead', evidence:'Repair loop log',
      how:['For every failed pilot test, log the fix required and re-test after remediation.','Do not mark a control implemented until its repair loop closes with a passed test or an approved exception.','Escalate repeated failures to the accountable executive if they threaten the pilot acceptance date.']},
    {id:'S5.08', title:'Obtain pilot acceptance', accountable:'Accountable executive', evidence:'Pilot acceptance record',
      how:['Review the full set of pilot test results against the pilot acceptance criteria.','Confirm no open high-severity failures remain unresolved or unexceptioned.','Sign the pilot acceptance record before authorising wider waves.']},
    {id:'S5.09', title:'Run an end-to-end recovery test', accountable:'Infrastructure lead', evidence:'Recovery test record',
      how:['Select a pilot-scope system and perform an actual restore from backup into an isolated environment.','Confirm the restored system is usable and data integrity holds, not just that the restore job completed.','Record restore time actually achieved against any recovery time objective.']},
    {id:'S5.10', title:'Plan the rollout waves', accountable:'Security Engineering Lead', evidence:'Wave rollout plan',
      how:['Group remaining in-scope services into waves by priority, dependency and shared-foundation reuse.','Sequence waves so dependent services follow their dependencies, not before.','Publish target dates per wave, flagged as local-adoption inputs.']},
    {id:'S5.11', title:'Expand controls into subsequent waves', accountable:'Security Engineering Lead + domain delegates', evidence:'Wave implementation logs',
      how:['Repeat the pilot\'s implement/test/record/repair cycle for each wave.','Reuse shared foundations rather than rebuilding them per wave.','Track wave progress against the plan and flag slippage early.']},
    {id:'S5.12', title:'Track urgent-protection items to closure', accountable:'Governance Lead', evidence:'Urgent-track closure log',
      how:['Review every urgent-protection referral raised since Stage 1 for current status.','Confirm interim mitigations remain effective until the permanent baseline control is implemented.','Close each item only once the permanent control is implemented and tested.']},
    {id:'S5.13', title:'Reconcile implementation against exceptions', accountable:'Governance Lead', evidence:'Exception reconciliation note',
      how:['Check whether any approved Stage 3 exception can now be closed because the underlying control has been implemented.','Update the exception register status accordingly.','Leave exceptions still required open with their existing expiry date intact.']},
    {id:'S5.14', title:'Update the operating model with real owners', accountable:'Security Architecture Lead', evidence:'Updated operating model',
      how:['Confirm the operating model from Stage 4 matches who is actually operating each implemented control.','Update any owner that changed during implementation.','Circulate the updated operating model ahead of Stage 6 handover.']},
    {id:'S5.15', title:'Confirm the Stage 5 gate', accountable:'Accountable executive', evidence:'Signed gate confirmation',
      how:['Confirm pilot acceptance, recovery test results and wave plan are complete.','Confirm urgent-track items are closed or have current interim mitigations.','Sign the gate confirmation and unlock Stage 6.']}
  ]
});

/* ---- STAGE 6 : Operate, respond and recover ---- */
registerStage({
  id:'S6', num:6, code:'S6', name:'Operate, respond and recover',
  accountable:'Chief Information Security Officer',
  lead:'Security Operations Lead',
  why:'Implemented controls only protect the organisation if they are actively operated: monitored, escalated on, and exercised for incident response and recovery. This stage is where the framework moves from build to steady-state defence.',
  inputs:['Implemented controls and control records (Stage 5)','Operating model (Stage 4/5)','Recovery test results (Stage 5)'],
  standards:['Proposed standard: Security Operations Runbook Standard','Proposed standard: Incident Response and Recovery Standard'],
  externalRefs:['NIST CSF 2.0 — Detect (DE), Respond (RS), Recover (RC) functions'],
  greenfield:'Stand up monitoring and response capability alongside the first pilot go-live so operations begin on day one of production use.',
  existing:'Integrate newly implemented controls into whatever operations capability already exists, closing any gap between what is monitored and what is actually implemented.',
  outputs:['Operational monitoring coverage','Incident response playbooks','Tested recovery procedures','Hybrid SOC escalation model'],
  gate:'Gate S6→S7: monitoring covers all implemented controls, at least one incident response tabletop exercise has been run, and recovery procedures are documented with named containment authority.',
  bestPractices:[
    {text:'Alert on missing log feeds, not only on suspicious events in the logs you do receive — a silent feed is itself a security failure.', stepRef:'S6.03'},
    {text:'Name who holds containment authority (e.g. to isolate a host or disable an account) before an incident happens, not during one.', stepRef:'S6.07'},
    {text:'Run a tabletop exercise using the synthetic worked service so gaps surface against a concrete, familiar scenario.', stepRef:'S6.09'},
    {text:'Keep retention periods set locally and documented — do not assume a vendor default meets your obligations.'},
    {text:'A managed SOC or MSSP provider operates detection and response; the accountable executive still holds accountability for outcomes.', stepRef:'S6.05'},
    {text:'Recovery procedures must be dependency-led — recovering a database before the identity provider it depends on will not produce a usable system.', stepRef:'S6.11'}
  ],
  mistakes:[
    {text:'Monitoring only the controls that were easiest to instrument, leaving baseline controls from later waves unmonitored.', stepRef:'S6.02'},
    {text:'Running an incident response playbook only on paper, never rehearsed with a tabletop exercise.', stepRef:'S6.09'},
    {text:'Assuming a managed provider\'s SLA transfers accountability for an incident outcome to the provider.', stepRef:'S6.05'}
  ],
  reqs:[
    {id:'REQ-6.1', text:'Monitoring coverage exists for all implemented baseline controls.', accept:'Monitoring coverage register matches implemented control list with no unmonitored gaps.'},
    {id:'REQ-6.2', text:'Missing log feeds trigger their own alert.', accept:'Health-check alert configuration demonstrated for at least one critical log source.'},
    {id:'REQ-6.3', text:'Incident response playbooks exist and are rehearsed.', accept:'At least one tabletop exercise record exists with findings and follow-up actions.'},
    {id:'REQ-6.4', text:'Recovery procedures are documented in dependency order.', accept:'Recovery runbook sequences services by dependency, not by convenience.'},
    {id:'REQ-6.5', text:'Containment authority is named for hybrid (internal + provider) operations.', accept:'RACI/escalation model names who can approve containment actions in each operating context.'}
  ],
  diagram:'d-s6-soc-escalation',
  actions:[
    {id:'S6.01', title:'Confirm monitoring scope against implemented controls', accountable:'Security Operations Lead', evidence:'Monitoring coverage register',
      how:['List every control marked "implemented" in Stage 5 control records.','Confirm a corresponding monitoring rule, dashboard or alert exists for each.','Flag any implemented control with no monitoring coverage as a Stage 6 gap.']},
    {id:'S6.02', title:'Define always-log and never-log lists', accountable:'Security Operations Lead', evidence:'Logging policy note',
      how:['Agree what must always be logged (authentication events, privilege changes, admin actions, data access to restricted classification).','Agree what must never be logged (raw secrets, full payment card numbers, unmasked passwords).','Publish both lists so implementers have a clear, shared standard.']},
    {id:'S6.03', title:'Configure missing-feed health alerts', accountable:'Security Operations Lead', evidence:'Health-alert configuration record',
      how:['Configure an alert that fires when a critical log source stops sending data, not only when it sends suspicious data.','Set a reasonable silence threshold per source type to avoid false positives from normal low-volume sources.','Test the health alert by deliberately pausing a non-production feed.']},
    {id:'S6.04', title:'Set retention locally and document it', accountable:'Data governance lead', evidence:'Retention configuration record',
      how:['Set log and evidence retention periods based on the organisation\'s own obligations, not a vendor default.','Document the retention period per log source/category.','Confirm retention settings are actually configured, not just documented.']},
    {id:'S6.05', title:'Confirm hybrid operating boundaries', accountable:'Security Operations Lead', evidence:'Hybrid operations boundary note',
      how:['Document which operational tasks are performed internally vs by a managed provider/MSSP.','Restate explicitly that the accountable executive retains accountability regardless of who operates day to day.','Confirm escalation paths exist between provider and internal team.']},
    {id:'S6.06', title:'Build incident response playbooks', accountable:'Security Operations Lead', evidence:'Playbook documents',
      how:['Write a playbook per major incident type (e.g. compromised credential, ransomware, data exposure).','Include detection triggers, initial containment steps, escalation path and communication template.','Cross-reference each playbook to the relevant baseline domain controls.']},
    {id:'S6.07', title:'Name containment authority', accountable:'Accountable executive', evidence:'Containment authority record',
      how:['Name who can approve isolating a host, disabling an account, or blocking traffic during an incident, in and out of business hours.','Confirm the named authority understands the decision thresholds from the Stage 1 delegated authority register.','Publish the containment authority alongside the incident response playbooks.']},
    {id:'S6.08', title:'Integrate provider escalation into the SOC model', accountable:'Security Operations Lead', evidence:'Hybrid SOC escalation diagram',
      how:['Map how an alert detected by a managed provider reaches an internal decision-maker with containment authority.','Confirm response time expectations are agreed with the provider contractually, not assumed.','Test the escalation path with a simulated (non-production) alert.']},
    {id:'S6.09', title:'Run an incident response tabletop exercise', accountable:'Security Operations Lead', evidence:'Tabletop exercise record',
      how:['Use the synthetic worked service (CUSTOMER_A/REQUEST_A) as the exercise scenario.','Walk participants through detection, containment, eradication, recovery and communication decisions.','Record findings and assign owners and dates for follow-up actions.']},
    {id:'S6.10', title:'Exercise the recovery runbook end to end', accountable:'Infrastructure lead', evidence:'Recovery exercise record',
      how:['Recover the worked service\'s dependency chain in order: identity, queue, processing/database, then SaaS reconciliation.','Confirm the recovered service actually functions for a test transaction, not just that infrastructure came back online.','Record actual recovery time against any target.']},
    {id:'S6.11', title:'Document dependency-led recovery order', accountable:'Infrastructure lead', evidence:'Dependency-led recovery runbook',
      how:['Map dependencies between services so recovery order is explicit (e.g. identity provider before any service that authenticates against it).','Avoid a convenience-based order that ignores dependency chains.','Cross-check the order against the Stage 5 recovery test result.']},
    {id:'S6.12', title:'Confirm 3-2-1-1-0 backup posture', accountable:'Infrastructure lead', evidence:'Backup posture record',
      how:['Confirm at least 3 copies of data, on 2 different media types, 1 offsite, 1 immutable/offline, and 0 errors after verification.','Confirm backup identities are separate from production administrative identities.','Record the posture per in-scope system, not as a single organisation-wide claim.']},
    {id:'S6.13', title:'Feed operational findings back into the gap register', accountable:'Security Operations Lead', evidence:'Operational findings log',
      how:['Log any control found ineffective in day-to-day operation, even if it previously passed its Stage 5 test.','Route findings back to the relevant domain delegate for remediation.','Carry unresolved findings into Stage 7 assurance review.']},
    {id:'S6.14', title:'Confirm the Stage 6 gate', accountable:'Accountable executive', evidence:'Signed gate confirmation',
      how:['Confirm monitoring coverage, playbooks, tabletop results and recovery exercises are complete.','Confirm containment authority is named and understood by all parties.','Sign the gate confirmation and unlock Stage 7.']}
  ]
});
