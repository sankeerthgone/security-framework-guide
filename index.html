<!DOCTYPE html>
<html lang="en-NZ">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Security roadmap and control framework</title>
<meta name="description" content="A dependency-led security roadmap: seven lifecycle stages, a minimum control baseline across fifteen domains, ten security disciplines and standards mapping.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#F5F6F8; --surface:#FFFFFF; --surface-2:#FAFBFC; --ink:#16202E; --ink-2:#4A5668; --ink-3:#6F7C8D;
  --rule:#D8DDE5; --rule-soft:#E7EAF0;
  --accent:#0B6B6F; --accent-soft:#E4F0F0; --amber:#B7700F; --amber-soft:#FBF1E1;
  --deny:#B23A3A; --deny-soft:#FAE8E8; --ok:#1F7A4C; --ok-soft:#E4F2EA;
  --radius:6px;
  --sans:'IBM Plex Sans',system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
  --mono:'IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --maxw:1160px;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --paper:#0F141B; --surface:#161D26; --surface-2:#1A222C; --ink:#E6EBF2; --ink-2:#9BA7B6; --ink-3:#7D8898;
    --rule:#2A333F; --rule-soft:#232B36;
    --accent:#4FB3B7; --accent-soft:#12292B; --amber:#D79A3F; --amber-soft:#2C2314;
    --deny:#E08585; --deny-soft:#2E1A1A; --ok:#58B584; --ok-soft:#12291F;
  }
}
:root[data-theme="dark"]{
  --paper:#0F141B; --surface:#161D26; --surface-2:#1A222C; --ink:#E6EBF2; --ink-2:#9BA7B6; --ink-3:#7D8898;
  --rule:#2A333F; --rule-soft:#232B36;
  --accent:#4FB3B7; --accent-soft:#12292B; --amber:#D79A3F; --amber-soft:#2C2314;
  --deny:#E08585; --deny-soft:#2E1A1A; --ok:#58B584; --ok-soft:#12291F;
}
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.6;-webkit-font-smoothing:antialiased}
h1,h2,h3,h4{margin:0 0 .5rem;line-height:1.25;font-weight:600}
h1{font-size:1.75rem;letter-spacing:-.01em}
h2{font-size:1.2rem}
h3{font-size:1rem}
p{margin:0 0 .85rem;max-width:72ch}
ul,ol{margin:0 0 .85rem;padding-left:1.15rem}
li{margin-bottom:.3rem;max-width:72ch}
a{color:var(--accent);text-decoration:none}
a:hover{text-decoration:underline}
button{font:inherit;cursor:pointer;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:3px}
.mono{font-family:var(--mono);font-size:.82em;font-weight:500}
.muted{color:var(--ink-2)}
.small{font-size:.86rem}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* top bar */
.topbar{position:sticky;top:0;z-index:50;background:var(--surface);border-bottom:1px solid var(--rule)}
.topbar-in{max-width:var(--maxw);margin:0 auto;display:flex;align-items:center;gap:1.25rem;padding:0 1rem;min-height:56px}
.logo{display:flex;align-items:center;gap:.5rem;font-weight:600;color:var(--ink);white-space:nowrap}
.logo:hover{text-decoration:none}
.logo svg{width:20px;height:20px;color:var(--accent);flex:0 0 auto}
nav.main{display:flex;gap:.25rem;overflow-x:auto;flex:1;scrollbar-width:none}
nav.main::-webkit-scrollbar{display:none}
nav.main a{padding:.45rem .6rem;font-size:.9rem;color:var(--ink-2);white-space:nowrap;border-bottom:2px solid transparent;border-radius:3px 3px 0 0}
nav.main a:hover{color:var(--ink);text-decoration:none}
nav.main a[aria-current="page"]{color:var(--ink);border-bottom-color:var(--accent);font-weight:600}
.theme-btn{background:none;border:1px solid var(--rule);border-radius:var(--radius);padding:.3rem .55rem;font-size:.8rem;color:var(--ink-2);white-space:nowrap}
.theme-btn:hover{color:var(--ink);border-color:var(--ink-3)}

main{max-width:var(--maxw);margin:0 auto;padding:2rem 1rem 3rem}
section{margin-bottom:2.5rem}
.eyebrow{font-size:.8rem;color:var(--ink-2);letter-spacing:.02em;margin-bottom:.35rem}
.lede{font-size:1.02rem;color:var(--ink-2);max-width:72ch}
.crumb{font-size:.85rem;color:var(--ink-2);margin-bottom:.6rem}
.crumb a{color:var(--ink-2)}

/* panels, cards, grids */
.panel{background:var(--surface);border:1px solid var(--rule);border-radius:var(--radius);padding:1.15rem 1.25rem}
.panel h3{margin-bottom:.6rem}
.grid{display:grid;gap:1rem}
.g2{grid-template-columns:1fr 1fr}
.g3{grid-template-columns:repeat(3,1fr)}
.g4{grid-template-columns:repeat(4,1fr)}
@media(max-width:820px){.g2,.g3,.g4{grid-template-columns:1fr}}
.card{display:block;background:var(--surface);border:1px solid var(--rule);border-radius:var(--radius);padding:1rem 1.1rem;color:inherit}
a.card:hover{border-color:var(--accent);text-decoration:none}
.card h3{margin-bottom:.25rem}
.quote{border-left:3px solid var(--rule);padding:.15rem 0 .15rem 1rem;color:var(--ink-2);margin:0 0 1.25rem;max-width:72ch}
.kv{display:flex;flex-wrap:wrap;gap:.4rem 2rem;font-size:.9rem;margin-bottom:1rem}
.kv div{display:flex;gap:.4rem}
.kv .k{color:var(--ink-2)}
.chip{display:inline-block;border:1px solid var(--rule);border-radius:999px;padding:.15rem .6rem;font-size:.8rem;color:var(--ink-2);background:var(--surface);margin:0 .3rem .3rem 0}
button.chip:hover{border-color:var(--ink-3);color:var(--ink)}
button.chip[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--accent);font-weight:600}
.tag{display:inline-block;font-size:.75rem;padding:.1rem .45rem;border-radius:3px;border:1px solid var(--rule);color:var(--ink-2);margin-right:.25rem}

/* tables */
.tw{overflow-x:auto;border:1px solid var(--rule);border-radius:var(--radius);background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:.9rem}
th,td{text-align:left;padding:.6rem .8rem;border-bottom:1px solid var(--rule-soft);vertical-align:top}
th{font-weight:600;color:var(--ink-2);font-size:.82rem;background:var(--surface-2);position:sticky;top:0}
tr:last-child td{border-bottom:none}
td .desc{display:block;color:var(--ink-2);font-size:.86rem;margin-top:.1rem}

/* lifecycle track */
.track{display:flex;gap:2px;overflow-x:auto;padding-bottom:.35rem;margin-bottom:.5rem;scrollbar-width:thin}
.track a{flex:1 0 auto;min-width:112px;position:relative;background:var(--surface);border:1px solid var(--rule);
  padding:.55rem 1.1rem .55rem 1.35rem;font-size:.88rem;color:var(--ink-2);clip-path:polygon(0 0,calc(100% - 12px) 0,100% 50%,calc(100% - 12px) 100%,0 100%,12px 50%);text-align:center}
.track a:first-child{padding-left:1rem;clip-path:polygon(0 0,calc(100% - 12px) 0,100% 50%,calc(100% - 12px) 100%,0 100%)}
.track a:last-child{clip-path:polygon(0 0,100% 0,100% 100%,0 100%,12px 50%)}
.track a:hover{color:var(--ink);text-decoration:none}
.track a[aria-current="step"],.track a[aria-current="page"]{background:var(--accent-soft);border-color:var(--accent);color:var(--accent);font-weight:600}
.band{display:flex;align-items:center;gap:.5rem;border:1px dashed var(--rule);border-radius:var(--radius);padding:.5rem .8rem;font-size:.86rem;color:var(--ink-2);margin-top:.5rem}
.band.amber{border-color:var(--amber);color:var(--amber);background:var(--amber-soft)}
.band.accent{border-color:var(--accent);color:var(--accent);background:var(--accent-soft)}

/* lifecycle wrapper */
.lifecycle{border:1px dashed var(--rule);border-radius:var(--radius);padding:.6rem;background:var(--surface-2)}
.lifecycle .track{margin-bottom:0}
.wrap-band{font-size:.78rem;color:var(--accent);background:var(--accent-soft);border:1px solid var(--accent);
  border-radius:4px;padding:.25rem .6rem;margin-bottom:.5rem;display:inline-block}
.loop-band{position:relative;margin-top:.5rem;border-top:1px dashed var(--amber);padding-top:.4rem}
.loop-band span{font-size:.78rem;color:var(--amber)}
.loop-band::before{content:'←';position:absolute;left:0;top:-.72rem;background:var(--surface-2);color:var(--amber);padding:0 .25rem;font-size:.8rem}

/* flow: inputs -> outputs */
.io{display:flex;align-items:stretch;gap:.75rem}
.io .panel{flex:1}
.io .arrow{display:flex;align-items:center;color:var(--ink-3);font-size:1.4rem}
@media(max-width:820px){.io{flex-direction:column}.io .arrow{justify-content:center;transform:rotate(90deg)}}

/* diagrams */
figure.dg{margin:0 0 1rem}
.dg-scroll{overflow-x:auto;border:1px solid var(--rule);border-radius:var(--radius);background:var(--surface)}
.dg-scroll svg{display:block;width:100%;min-width:620px;height:auto}
figure.dg figcaption{font-size:.85rem;color:var(--ink-2);margin-top:.5rem;max-width:72ch}
.legend{display:flex;flex-wrap:wrap;gap:.75rem;font-size:.8rem;color:var(--ink-2);margin-top:.5rem}
.legend span{display:flex;align-items:center;gap:.35rem}
.legend i{width:14px;height:10px;border-radius:2px;border:1.5px solid var(--ink-3);display:inline-block}
.legend i.owner{border-color:var(--accent);background:var(--accent-soft)}
.legend i.control{border-color:var(--ink-3)}
.legend i.decision{border-color:var(--amber);background:var(--amber-soft)}
.legend i.data{border-style:dashed;border-color:var(--ink-3)}
.legend i.deny{border-style:dashed;border-color:var(--deny);background:var(--deny-soft)}
.legend i.ok{border-color:var(--ok);background:var(--ok-soft)}

/* activities */
details.act{border:1px solid var(--rule);border-radius:var(--radius);background:var(--surface);margin-bottom:.4rem}
details.act+details.act{margin-top:-.4rem;border-top-left-radius:0;border-top-right-radius:0}
details.act summary{list-style:none;cursor:pointer;display:grid;grid-template-columns:1fr 200px 220px 16px;gap:.75rem;padding:.6rem .9rem;align-items:baseline}
details.act summary::-webkit-details-marker{display:none}
details.act summary:hover{background:var(--surface-2)}
details.act .act-t{font-weight:500}
details.act .act-m{font-size:.85rem;color:var(--ink-2)}
details.act .caret{color:var(--ink-3);font-size:.8rem;transition:transform .15s}
details.act[open] .caret{transform:rotate(90deg)}
details.act .body{padding:0 .9rem .9rem;border-top:1px solid var(--rule-soft)}
details.act .body ul{margin:.7rem 0 0}
@media(max-width:820px){
  details.act summary{grid-template-columns:1fr 16px}
  details.act summary .act-m{display:none}
  details.act .body .m-meta{display:block}
}
.m-meta{display:none;font-size:.85rem;color:var(--ink-2);margin-top:.6rem}

/* callouts */
.callout{border:1px solid var(--rule);border-left:3px solid var(--accent);border-radius:var(--radius);background:var(--surface);padding:.9rem 1.1rem}
.callout.amber{border-left-color:var(--amber)}
.callout h3{margin-bottom:.45rem}
.ck li{list-style:none;position:relative;padding-left:1.3rem}
.ck li::before{content:'✓';position:absolute;left:0;color:var(--ok);font-weight:600}
.wn li{list-style:none;position:relative;padding-left:1.3rem}
.wn li::before{content:'!';position:absolute;left:.25rem;color:var(--amber);font-weight:700}
.ck,.wn{padding-left:0}

/* stepper */
ol.stepper{list-style:none;padding:0;counter-reset:s}
ol.stepper li{counter-increment:s;position:relative;padding-left:2.2rem;padding-bottom:.9rem;border-left:1px solid var(--rule);margin-left:.9rem}
ol.stepper li:last-child{border-left-color:transparent;padding-bottom:0}
ol.stepper li::before{content:counter(s);position:absolute;left:-.9rem;top:-.1rem;width:1.8rem;height:1.8rem;border-radius:50%;
  background:var(--surface);border:1px solid var(--rule);color:var(--ink-2);font-size:.8rem;display:flex;align-items:center;justify-content:center}

/* test cards */
.test{border:1px solid var(--rule);border-top:2px solid var(--ink-3);border-radius:var(--radius);background:var(--surface);padding:.9rem 1rem}
.test.pos{border-top-color:var(--ok)} .test.neg{border-top-color:var(--deny)} .test.fail{border-top-color:var(--amber)}
.test h3{font-size:.85rem;color:var(--ink-2);font-weight:600;margin-bottom:.3rem}

/* matrix */
.mx td.c{text-align:center;font-variant-numeric:tabular-nums;font-size:.82rem}
.mx td.c[data-l="0"]{color:var(--ink-3)}
.mx td.c[data-l="1"]{background:color-mix(in srgb,var(--accent) 8%,transparent)}
.mx td.c[data-l="2"]{background:color-mix(in srgb,var(--accent) 16%,transparent)}
.mx td.c[data-l="3"]{background:color-mix(in srgb,var(--accent) 26%,transparent);font-weight:600}
.mx td.c[data-l="4"]{background:color-mix(in srgb,var(--accent) 38%,transparent);font-weight:600}

/* pager, search */
.pager{display:flex;justify-content:space-between;gap:1rem;margin-top:1.5rem}
.pager a{flex:1;border:1px solid var(--rule);border-radius:var(--radius);padding:.7rem .9rem;background:var(--surface);font-size:.9rem}
.pager a:hover{border-color:var(--accent);text-decoration:none}
.pager .l{display:block;font-size:.78rem;color:var(--ink-2)}
input.search{width:100%;max-width:340px;padding:.45rem .65rem;border:1px solid var(--rule);border-radius:var(--radius);background:var(--surface);color:var(--ink);font:inherit;font-size:.9rem}
input.search:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft)}

footer.site{border-top:1px solid var(--rule);margin-top:2rem}
footer.site p{max-width:var(--maxw);margin:0 auto;padding:1rem;font-size:.82rem;color:var(--ink-2)}

@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
@media print{.topbar,.pager{display:none}details.act{break-inside:avoid}details.act .body{display:block!important}}
</style>
</head>
<body>
<header class="topbar">
  <div class="topbar-in">
    <a class="logo" href="#/">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M12 2 4 5.5v6c0 5 3.4 9 8 10.5 4.6-1.5 8-5.5 8-10.5v-6L12 2Z"/><path d="m8.8 11.8 2.3 2.3 4.2-4.3"/></svg>
      <span>Security framework</span>
    </a>
    <nav class="main" id="nav" aria-label="Sections"></nav>
    <button class="theme-btn" id="themeBtn" aria-label="Switch colour theme">Theme</button>
  </div>
</header>
<main id="main" tabindex="-1"></main>
<footer class="site"><p>Personal reference framework. Worked examples are synthetic; tool names are illustrative, not recommendations.</p></footer>

<script>
/* ============================================================
   DATA (preserved from the source framework content)
   ============================================================ */
const STAGES = [];      // filled by registerStage()
const STAGE_ACTIONS = []; // flat list, each {id, stageId, title, accountable, evidence, how:[]}
const DOMAINS = [];
const BASELINE_CONTROLS = [];
const DISCIPLINES = [];
const TOOLS = [];
const FRAMEWORKS = {};

const GLOSSARY = [];




function registerStage(s){ STAGES.push(s); s.actions.forEach(a=>STAGE_ACTIONS.push(Object.assign({stageId:s.id}, a))); }

/* ---- STAGE 1 : Establish authority, scope and ownership ---- */
registerStage({
  id:'S1', num:1, code:'S1', name:'Establish authority, scope and ownership',
  accountable:'Chief Information Security Officer (or equivalent accountable executive)',
  lead:'Security Governance Lead',
  why:'Nothing downstream is trustworthy if nobody can say, with a name attached, who owns the decision. This stage exists to fix accountability, scope and delegated authority before any control work starts — so later stages have a clear "who decides" instead of stalling on it.',
  inputs:['Executive sponsor mandate','Existing organisational chart','Any prior security policy documents','Regulatory / contractual obligations register'],
  standards:['Proposed standard: Security Governance Charter','Proposed standard: Delegated Authority Register'],
  externalRefs:['NIST CSF 2.0 — Govern (GV) function','ISO/IEC 27001:2022 clause 5 — Leadership'],
  greenfield:'Stand up the governance charter and RACI from a blank slate: appoint the accountable executive, draft the charter, and set delegated-authority thresholds before any tooling or hiring decisions are made.',
  existing:'Reconcile whatever accountability currently exists (informal or scattered) against the charter template; formally re-confirm or reassign ownership rather than assuming current owners already hold documented authority.',
  outputs:['Signed governance charter','Delegated authority register','Scope statement (in/out)','RACI skeleton for stages 1-7'],
  gate:'the accountable executive has signed the charter, scope is documented and agreed, and at least one delegated decision-maker is named for each of the 15 baseline domains.',
  bestPractices:[
    {text:'Name one accountable executive, not a committee — committees diffuse accountability exactly where you need it sharpest.', stepRef:'S1.01'},
    {text:'Write delegated-authority thresholds in monetary/risk terms so delegates know exactly when to escalate.', stepRef:'S1.03'},
    {text:'Publish the scope statement including what is explicitly out of scope so nobody assumes silent coverage.', stepRef:'S1.02'},
    {text:'Timebox this stage — governance work expands to fill available time; set a hard date for the charter signature.'},
    {text:'Involve legal/compliance early on regulatory obligations rather than retrofitting them into an already-signed charter.', stepRef:'S1.05'},
    {text:'Store the charter and RACI where every subsequent stage owner can find them without asking — a shared, version-controlled location beats an email attachment.'}
  ],
  mistakes:[
    {text:'Treating the charter as a formality and skipping executive sign-off — later stage gates then have nothing to point back to.', stepRef:'S1.01'},
    {text:'Defining scope so broadly it includes physical/OT/IoT without resourcing them, instead of deferring them explicitly in the scope statement.', stepRef:'S1.02'},
    {text:'Leaving delegated authority verbal — the first real incident then stalls on "who can approve this?"', stepRef:'S1.03'}
  ],
  reqs:[
    {id:'REQ-1.1', text:'A named accountable executive exists for the security framework.', accept:'Charter document names one individual with title, signed and dated.'},
    {id:'REQ-1.2', text:'Scope is documented, including explicit exclusions.', accept:'Scope statement lists in-scope domains and out-of-scope items with rationale.'},
    {id:'REQ-1.3', text:'Delegated authority is defined for each baseline domain.', accept:'Delegated authority register has one named delegate per domain code.'},
    {id:'REQ-1.4', text:'A RACI skeleton exists for all seven stages.', accept:'RACI table published covering Responsible/Accountable/Consulted/Informed per stage.'},
    {id:'REQ-1.5', text:'Regulatory and contractual obligations are catalogued.', accept:'Obligations register cross-referenced to at least one accountable owner each.'}
  ],
  diagram:'d-s1-governance',
  actions:[
    {id:'S1.01', title:'Appoint the accountable executive', accountable:'Executive sponsor', evidence:'Signed appointment memo or board minute',
      how:['Identify a single executive (e.g. CISO, Head of IT) who will hold accountability — not a working group.','Get written, dated sign-off from the executive sponsor confirming the appointment.','Record the appointment in the governance charter and circulate it to all stage leads.']},
    {id:'S1.02', title:'Draft and agree the scope statement', accountable:'Governance Lead', evidence:'Approved scope statement document',
      how:['List every service, environment and data type intended to be in scope.','Explicitly list deferred items (physical security, OT, IoT) with the reason for deferral.','Circulate for review to legal, IT operations and business unit leads before finalising.']},
    {id:'S1.03', title:'Define delegated authority thresholds', accountable:'Accountable executive', evidence:'Delegated authority register',
      how:['For each of the 15 baseline domains, name one delegate empowered to make day-to-day decisions.','State the monetary or risk threshold above which a decision must escalate to the accountable executive.','Confirm each delegate in writing and record acceptance.']},
    {id:'S1.04', title:'Build the RACI skeleton for all seven stages', accountable:'Governance Lead', evidence:'RACI matrix (stage × role)',
      how:['List every role likely to touch the framework: executive, delegates, IT operations, security engineering, legal, providers.','Assign Responsible/Accountable/Consulted/Informed per stage at a high level — detail is refined per stage later.','Publish the RACI alongside the charter.']},
    {id:'S1.05', title:'Catalogue regulatory and contractual obligations', accountable:'Legal / Compliance lead', evidence:'Obligations register',
      how:['List applicable regulation, industry codes and material customer/supplier contract security clauses.','Map each obligation to an accountable owner and, where possible, to a baseline domain.','Flag obligations with a hard compliance date for prioritisation in Baseline.']},
    {id:'S1.06', title:'Identify existing security-relevant policies', accountable:'Governance Lead', evidence:'Policy inventory',
      how:['Search for any existing security, acceptable-use, data-handling or incident policies, however informal.','Record their status (current, stale, superseded) rather than assuming they are still authoritative.','Feed the inventory into the Standards & Policies page for Baseline reconciliation.']},
    {id:'S1.07', title:'Confirm provider and outsourcing boundaries', accountable:'Accountable executive', evidence:'Provider boundary statement',
      how:['List managed service providers, MSSPs and outsourced IT functions in scope.','State explicitly that a managed provider does not transfer accountability — the accountable executive remains accountable regardless of who operates the control.','Record this in the RACI as an explicit boundary note.']},
    {id:'S1.08', title:'Set the urgent-protection parallel track', accountable:'Governance Lead', evidence:'Urgent protection charter note',
      how:['Identify any immediate, known high-risk exposures that cannot wait for the full seven-stage sequence.','Charter a short parallel track with its own lightweight authority so urgent fixes are not blocked on governance completion.','Record what "urgent" means for this organisation so the track is not misused for ordinary work.']},
    {id:'S1.09', title:'Establish the evidence and record-keeping approach', accountable:'Governance Lead', evidence:'Evidence handling note',
      how:['Decide where control records, practice records and evidence will be stored and who can access them.','Set the rule that documented, configured, tested and maintained are four distinct states — never conflate them (see Overview principles).','Confirm the storage location protects any sensitive material appropriately.']},
    {id:'S1.10', title:'Agree the standards-naming convention', accountable:'Governance Lead', evidence:'Standards register skeleton',
      how:['Agree a naming and numbering convention for proposed organisational standards (e.g. domain-code prefixed).','Create an empty standards register ready for Baseline population.','Confirm the convention with delegates so future documents are consistent.']},
    {id:'S1.11', title:'Communicate the charter to the organisation', accountable:'Accountable executive', evidence:'Communication record',
      how:['Prepare a short communication explaining the charter, scope and delegated authority to affected teams.','Send it from the accountable executive, not delegated staff, to signal authority.','Store a copy of the communication as evidence of organisational awareness.']},
    {id:'S1.12', title:'Confirm Govern exit criteria', accountable:'Accountable executive', evidence:'Signed exit criteria record',
      how:['Check every REQ-1.x acceptance criterion against the artefacts produced.','Confirm at least one delegate is named per baseline domain before progressing.','Sign and date the exit criteria record and unlock Discover in the tracker.']}
  ]
});


/* ---- STAGE 2 : Discover services, assets, data and gaps ---- */
registerStage({
  id:'S2', num:2, code:'S2', name:'Discover services, assets, data and gaps',
  accountable:'Chief Information Security Officer',
  lead:'Security Architecture Lead',
  why:'You cannot protect what you cannot see. This stage builds the inventory of services, assets, data flows and identities so that Baseline can set requirements against reality rather than assumption, and so gaps are found before they are exploited rather than after.',
  inputs:['Signed governance charter (Govern)','Existing CMDB / asset registers, if any','Network diagrams','Cloud tenant and subscription list','Data classification scheme, if any'],
  standards:['Proposed standard: Asset & Service Inventory Standard','Proposed standard: Data Classification Standard'],
  externalRefs:['NIST CSF 2.0 — Identify (ID) function','CIS Controls v8 — Control 1 (Inventory of enterprise assets), Control 3 (Data protection)'],
  greenfield:'Build the inventory alongside the architecture as services are designed — there is little legacy to discover, so focus discovery on cloud tenants, identity providers and any inherited supplier connections.',
  existing:'Run structured discovery against live environments: automated asset/cloud discovery tools, directory exports, data flow interviews with service owners, and reconciliation against any existing (likely incomplete) CMDB.',
  outputs:['Service and asset inventory','Data flow map with classification','Identity and directory inventory','Gap register versus the 15 baseline domains','Risk register with rated risks and treatment decisions'],
  gate:'inventory covers all in-scope services named in the Govern scope statement, data flows are mapped for the reference service, and the gap register is populated against all 15 domains.',
  bestPractices:[
    {text:'Automate discovery wherever possible (cloud APIs, EDR/agent inventories, directory exports) — manual spreadsheets go stale within weeks.', stepRef:'S2.02'},
    {text:'Classify data at the point of discovery, not later — retrofitting classification onto an unlabelled estate is far slower.', stepRef:'S2.05'},
    {text:'Map identity providers and trust relationships explicitly, including any federation to SaaS or partner tenants.', stepRef:'S2.07'},
    {text:'Record what you cannot find as a gap, not a silent omission — an unknown asset is itself a finding.'},
    {text:'Reconcile discovery output against the Govern scope statement to catch shadow IT outside the intended boundary.', stepRef:'S2.09'},
    {text:'Keep the inventory living — assign an owner and a refresh cadence rather than treating this as a one-off snapshot.', stepRef:'S2.12'}
  ],
  mistakes:[
    {text:'Relying solely on a stale CMDB instead of validating it against live discovery tooling.', stepRef:'S2.02'},
    {text:'Mapping data flows only for "obvious" systems and missing middleware, queues or batch jobs that move sensitive data.', stepRef:'S2.06'},
    {text:'Treating the gap register as a one-time exercise rather than an input that Baseline will directly consume.', stepRef:'S2.14'}
  ],
  reqs:[
    {id:'REQ-2.1', text:'A service and asset inventory exists covering the agreed scope.', accept:'Inventory record count matches or exceeds discovery-tool asset count within an agreed tolerance.'},
    {id:'REQ-2.2', text:'Data flows are mapped with classification for the reference service.', accept:'Data flow map shows CUSTOMER_A/CUSTOMER_B isolation points end to end.'},
    {id:'REQ-2.3', text:'Identity providers and trust relationships are inventoried.', accept:'Identity inventory lists every IdP, federation and workload identity source in scope.'},
    {id:'REQ-2.4', text:'A gap register exists mapped to all 15 baseline domains.', accept:'Gap register has at least one entry (including "no gap found") per domain code.'},
    {id:'REQ-2.5', text:'Discovery output is reconciled against the Govern scope statement.', accept:'Reconciliation note lists any shadow-IT or out-of-scope findings and their disposition.'}
  ],
  diagram:'d-s2-reference-service',
  actions:[
    {id:'S2.01', title:'Select and deploy discovery tooling', accountable:'Security Architecture Lead', evidence:'Tooling deployment record',
      how:['Choose discovery methods appropriate to each environment: cloud-native inventory APIs, EDR agent inventories, directory exports, network scanning.','Deploy read-only discovery access — avoid intrusive scanning without change-control sign-off.','Confirm coverage against the known environment list before relying on results.']},
    {id:'S2.02', title:'Inventory services and hosting environments', accountable:'Security Architecture Lead', evidence:'Service inventory export',
      how:['List every service in scope, its hosting environment (cloud, on-prem, SaaS) and its owner.','Cross-check against billing/subscription records to catch unlisted environments.','Flag any service without a named owner as a gap.']},
    {id:'S2.03', title:'Inventory compute, network and endpoint assets', accountable:'Infrastructure lead', evidence:'Asset inventory export',
      how:['Pull asset lists from EDR, MDM, hypervisor and cloud consoles.','Reconcile counts across sources — large discrepancies usually indicate missing agents or shadow assets.','Record asset criticality where known, to prioritise Baseline baseline application.']},
    {id:'S2.04', title:'Inventory identity providers and directories', accountable:'IAM lead', evidence:'Identity inventory',
      how:['List every directory, identity provider and federation trust (including SaaS admin consoles with local accounts).','Note which identities are workforce, customer, or workload (machine) identities.','Flag any directory with no defined owner.']},
    {id:'S2.05', title:'Establish or confirm the data classification scheme', accountable:'Data governance lead', evidence:'Data classification standard',
      how:['Define a small number of classification tiers (e.g. public, internal, confidential, restricted).','Assign a default tier to unclassified data pending explicit classification.','Publish the scheme so Discover data-flow mapping can apply it consistently.']},
    {id:'S2.06', title:'Map data flows for in-scope services', accountable:'Security Architecture Lead', evidence:'Data flow diagrams',
      how:['Interview service owners to trace data from entry point to storage to any downstream consumer.','Include middleware, queues and batch/reconciliation jobs, not just front-end paths.','Classify each flow using the Discover.05 scheme and note any cross-border transfer.']},
    {id:'S2.07', title:'Trace the reference service data flow', accountable:'Security Architecture Lead', evidence:'Worked-service flow diagram',
      how:['Trace CUSTOMER_A submitting REQUEST_A from the cloud portal through the on-prem queue and processing/database layer to the independent SaaS case management system.','Confirm and document the isolation point that prevents CUSTOMER_B from ever reading CUSTOMER_A\'s request.','Record the reconciled status flow as the running example carried through later stages.']},
    {id:'S2.08', title:'Inventory external and supplier connections', accountable:'Security Architecture Lead', evidence:'Supplier connectivity register',
      how:['List every inbound/outbound connection to suppliers, partners and managed providers.','Note the authentication method and data classification carried on each connection.','Flag any connection lacking a named business owner.']},
    {id:'S2.09', title:'Reconcile discovery against the Govern scope statement', accountable:'Governance Lead', evidence:'Reconciliation note',
      how:['Compare discovered assets/services against the agreed scope statement.','Log anything found outside scope (shadow IT) as a decision item: bring into scope, formally exclude, or decommission.','Route decisions back to the accountable executive where they change the agreed scope.']},
    {id:'S2.10', title:'Assess current control state per domain', accountable:'Domain delegates', evidence:'Current-state assessment per domain',
      how:['For each of the 15 baseline domains, record what controls already exist, informally or formally.','Distinguish documented from configured from tested — do not assume a policy document means the control is active.','Capture this as the baseline for the Discover gap register.']},
    {id:'S2.11', title:'Identify quick-win risks requiring urgent-track attention', accountable:'Security Architecture Lead', evidence:'Urgent-track referral log',
      how:['Flag any discovery finding that represents immediate, material exposure (e.g. internet-exposed admin interface).','Refer these into the Govern urgent-protection parallel track rather than waiting for the full baseline rollout.','Confirm each referral is acknowledged by the relevant domain delegate.']},
    {id:'S2.12', title:'Assign inventory ownership and refresh cadence', accountable:'Governance Lead', evidence:'Inventory ownership record',
      how:['Name an owner responsible for keeping each inventory (service, asset, identity, data flow) current.','Set a refresh cadence (e.g. quarterly) and a trigger-based refresh on major change.','Record the cadence in the proposed Asset & Service Inventory Standard.']},
    {id:'S2.12b', title:'Assess and rate risk against the discovered estate', accountable:'Security Architecture Lead', evidence:'Risk register with rated risks and treatment decisions',
      how:['Rate each discovered gap for impact and likelihood against the agreed risk appetite, not on instinct.','Record a treatment decision for every rated risk: treat, tolerate, transfer or terminate.','Carry rated risks into the baseline decision so control selection is justified by risk, not habit.']},
    {id:'S2.13', title:'Build the domain gap register', accountable:'Security Architecture Lead', evidence:'Gap register (15 domains)',
      how:['For each domain, compare current-state assessment (S2.10) against the intended baseline control list.','Record explicit "no gap found" entries as well as gaps — silence is not evidence of adequacy.','Prioritise gaps using discovered asset criticality and any urgent-track referrals.']},
    {id:'S2.14', title:'Confirm Discover exit criteria', accountable:'Accountable executive', evidence:'Signed exit criteria record',
      how:['Verify inventory coverage against the Govern scope statement.','Confirm the reference-service data flow and gap register are complete.','Sign the exit criteria record and unlock Baseline.']}
  ]
});
/* ---- STAGE 3 : Approve requirements and the minimum baseline ---- */
registerStage({
  id:'S3', num:3, code:'S3', name:'Approve requirements and the minimum baseline',
  accountable:'Chief Information Security Officer',
  lead:'Security Governance Lead',
  why:'Discovery tells you what exists; this stage decides what "good enough" means and gets it formally approved, so that every later implementation decision can be checked against an agreed baseline instead of individual opinion.',
  inputs:['Gap register (Discover and assess)','Risk register with rated risks (Discover and assess)','Draft requirement set','Regulatory obligations register (Govern)','Existing policy inventory (Govern)'],
  standards:['Proposed standard: Minimum Baseline Control Standard','Proposed standard: Exception Management Standard'],
  externalRefs:['ISO/IEC 27001:2022 Annex A control catalogue','NIST SP 800-53 Rev. 5 control baselines'],
  greenfield:'Adopt the full approved control baseline from the outset as a design constraint — it is cheaper to build to the baseline than to retrofit it.',
  existing:'Work through the Discover gap register domain by domain, approving either remediation or a time-bound, approved exception for each identified gap — an approved exception is never treated as a passed test.',
  outputs:['Approved requirement set (BR/GR/FR/OR/AR/NFR)','Approved minimum baseline across 15 domains','Exception register','Updated standards register'],
  gate:'the approved requirement set and baseline are formally approved by the accountable executive, and every Discover gap has either an approved remediation plan or an approved, time-bound exception.',
  bestPractices:[
    {text:'Approve the baseline as a whole document, not control-by-control — piecemeal approval invites scope creep and inconsistency.', stepRef:'S3.11'},
    {text:'Give every exception an expiry date and a named owner — an exception with no review date becomes permanent by default.', stepRef:'S3.09'},
    {text:'Keep requirements vendor-neutral in this stage; tool selection belongs in Design/5, not here.'},
    {text:'Cross-reference each approved control to the regulatory obligations register so compliance mapping is not a separate exercise later.', stepRef:'S3.04'},
    {text:'Publish the control-record field list now so evidence capture is consistent from Build onward.', stepRef:'S3.12'},
    {text:'Make clear that missing targets (e.g. an undefined retention period) are open decisions, not silent defaults.'}
  ],
  mistakes:[
    {text:'Treating an approved exception as equivalent to a passed test — it is a documented risk acceptance, not evidence of control effectiveness.', stepRef:'S3.09'},
    {text:'Approving requirements that are actually tool-specific, closing off legitimate architecture choices in Design.', stepRef:'S3.03'},
    {text:'Leaving thresholds, dates and jurisdictions as vague placeholders instead of flagging them explicitly as local adoption inputs.', stepRef:'S3.13'}
  ],
  reqs:[
    {id:'REQ-3.1', text:'The requirement set is approved by the accountable executive.', accept:'Signed approval record referencing the specific catalogue version.'},
    {id:'REQ-3.2', text:'The minimum control baseline is approved across all domains.', accept:'Signed baseline document with per-domain control counts matching the published totals.'},
    {id:'REQ-3.3', text:'Every Discover gap has a disposition.', accept:'Gap register shows remediation plan or approved exception for 100% of entries.'},
    {id:'REQ-3.4', text:'Exceptions are time-bound and owned.', accept:'Exception register entries each have an expiry date and named owner.'},
    {id:'REQ-3.5', text:'The control-record field list is published.', accept:'Control-record template available and referenced by Design design work.'}
  ],
  diagram:'d-s3-baseline-gate',
  actions:[
    {id:'S3.01', title:'Draft the approved requirement set', accountable:'Governance Lead', evidence:'Draft requirement set',
      how:['Group requirements into BR (business), GR (governance), FR (functional security), OR (operational), AR (assurance), NFR (non-functional).','Write each requirement as a testable statement with acceptance criteria, not an aspiration.','Cross-reference each requirement to the stage(s) that deliver it.']},
    {id:'S3.02', title:'Confirm scope in/out for physical, OT and IoT', accountable:'Governance Lead', evidence:'Scope decision record',
      how:['Confirm physical security, OT and IoT remain deferred per the Govern scope statement.','Confirm hosting, power, connectivity and supplier interfaces are explicitly kept in scope where they affect in-scope services.','Record the rationale so the decision can be revisited deliberately rather than by drift.']},
    {id:'S3.03', title:'Keep baseline controls vendor-neutral', accountable:'Security Architecture Lead', evidence:'Vendor-neutral control wording review',
      how:['Review each draft control statement for embedded product names or tool-specific assumptions.','Replace with outcome-based wording; move any illustrative tool references to the separate Tool catalogue.','Confirm reviewers understand documented ≠ configured ≠ tested ≠ maintained as four distinct states.']},
    {id:'S3.04', title:'Map controls to regulatory obligations', accountable:'Legal / Compliance lead', evidence:'Obligation-to-control map',
      how:['Cross-reference the Govern obligations register to specific baseline controls.','Flag obligations with no mapped control as a gap requiring a new or adjusted control.','Note that this mapping is indicative, not a certified compliance mapping.']},
    {id:'S3.05', title:'Walk the gap register domain by domain', accountable:'Domain delegates', evidence:'Gap disposition log',
      how:['For each Discover gap, decide: remediate now, remediate on a schedule, or request an exception.','Record the decision-maker and rationale for each disposition.','Escalate any gap above the delegate\'s authority threshold to the accountable executive.']},
    {id:'S3.06', title:'Assess urgent-track gaps first', accountable:'Domain delegates', evidence:'Urgent-track disposition',
      how:['Prioritise dispositions for gaps already referred to the urgent-protection track in Discover.','Confirm interim mitigations are in place while the full baseline control is rolled out.','Record interim mitigation evidence separately from the eventual baseline control evidence.']},
    {id:'S3.07', title:'Draft the exception request template', accountable:'Governance Lead', evidence:'Exception request template',
      how:['Include fields for control reference, business justification, compensating control, expiry date and owner.','Require accountable-executive sign-off above the domain delegate\'s authority threshold.','Store approved exceptions where they are visible to the relevant Build/6 implementers.']},
    {id:'S3.08', title:'Review and approve individual exception requests', accountable:'Accountable executive / domain delegates', evidence:'Approved exception records',
      how:['Review each exception request against the template fields.','Explicitly record that an approved exception is a risk acceptance, not a passed test.','Set a calendar reminder ahead of each exception\'s expiry date for re-review.']},
    {id:'S3.09', title:'Publish the exception register', accountable:'Governance Lead', evidence:'Exception register',
      how:['Consolidate all approved exceptions into a single register with status, owner and expiry.','Make the register visible to Assure assurance activity.','Review the register at a fixed cadence, not only at individual expiry dates.']},
    {id:'S3.10', title:'Reconcile against existing policy inventory', accountable:'Governance Lead', evidence:'Policy reconciliation note',
      how:['Compare the Govern policy inventory against the new requirement set and baseline.','Mark existing policies as superseded, retained, or requiring update.','Update the standards register to reflect the reconciled position.']},
    {id:'S3.11', title:'Seek formal approval of the full baseline', accountable:'Accountable executive', evidence:'Signed baseline approval',
      how:['Present the complete requirement set and approved control baseline as a single package for approval.','Avoid approving individual controls in isolation, to preserve consistency across domains.','Record the approval with a version number for future change tracking.']},
    {id:'S3.12', title:'Publish the control-record field list', accountable:'Governance Lead', evidence:'Control-record template',
      how:['Define the fields every control record must capture (see the Requirements page for the full field list).','Circulate the template to domain delegates ahead of Design/5 implementation.','Confirm the template distinguishes implementation state from validation state.']},
    {id:'S3.13', title:'Flag open local-adoption inputs', accountable:'Governance Lead', evidence:'Open decisions log',
      how:['List every target, date, threshold or jurisdiction left unresolved in the approved baseline.','Record each as an explicit open decision with an owner, not a silent default.','Carry the open decisions log forward into Design design work.']}
  ]
});
/* ---- STAGE 4 : Design the target architecture and operating model ---- */
registerStage({
  id:'S4', num:4, code:'S4', name:'Design the target architecture and operating model',
  accountable:'Chief Information Security Officer',
  lead:'Security Architecture Lead',
  why:'An approved baseline is a set of outcomes, not a blueprint. This stage turns it into a concrete target architecture and operating model — including how threats against the design are found and mitigated before a single control is built — so Build implements against a design, not improvisation.',
  inputs:['Approved requirement set and baseline (Baseline)','Current-state asset and data-flow inventory (Discover and assess)','Open local-adoption decisions log (Baseline)'],
  standards:['Proposed standard: Reference Architecture Standard','Proposed standard: Threat Modelling Standard'],
  externalRefs:['NIST CSF 2.0 — Protect (PR) function','OWASP Application Security Verification Standard (ASVS)'],
  greenfield:'Design the target architecture directly — zones, identity paths and control placement can be set correctly from day one without migration constraints.',
  existing:'Design a target architecture and an explicit current-to-target migration path; do not silently assume the current architecture already matches intended zoning or control placement.',
  outputs:['Target reference architecture diagram','Threat model for the reference service','Architecture decision records','Operating model (who runs what, day to day)'],
  gate:'the target architecture and threat model are reviewed and signed off, every architecture decision is recorded against one of the 14 agreed decisions, and the operating model names who runs each control day to day.',
  bestPractices:[
    {text:'Draw the current state and the target state side by side — gaps between them become the Build implementation backlog directly.', stepRef:'S4.02'},
    {text:'Run the threat model against the actual reference-service flow (CUSTOMER_A/CUSTOMER_B), not a generic abstract system — abstractions hide the exact isolation failure you most need to catch.', stepRef:'S4.05'},
    {text:'Record every material architecture choice as a decision with a rationale, even when the choice seems obvious at the time.', stepRef:'S4.08'},
    {text:'No firewall, WAF or API gateway placement decision should be treated as replacing application-level authorisation — record that explicitly in the architecture.', stepRef:'S4.04'},
    {text:'Name an operating owner for every control in the target architecture before Build begins — an unowned control will not get implemented reliably.', stepRef:'S4.11'},
    {text:'Treat post-quantum cryptography as an inventory-and-track item now, not a retrofit later — record which algorithms and certificates would need to change.'}
  ],
  mistakes:[
    {text:'Designing the architecture without revisiting the threat model when a design detail changes.', stepRef:'S4.05'},
    {text:'Assuming a WAF or API gateway means application authorisation checks can be skipped or weakened.', stepRef:'S4.04'},
    {text:'Leaving the operating model implicit ("infrastructure team will sort it out") instead of naming a control owner.', stepRef:'S4.11'}
  ],
  reqs:[
    {id:'REQ-4.1', text:'A target reference architecture is documented.', accept:'Architecture diagram covers all zones used by the reference service and is reviewed by the Security Architecture Lead.'},
    {id:'REQ-4.2', text:'A threat model exists for the reference service.', accept:'Threat model lists assets, entry points, threats per element, mitigations and residual risk.'},
    {id:'REQ-4.3', text:'Architecture decisions are recorded.', accept:'Each material decision is logged against one of the 14 agreed decisions with rationale.'},
    {id:'REQ-4.4', text:'The operating model names an owner per control.', accept:'Operating model table has no blank "owner" cell for any in-scope control.'},
    {id:'REQ-4.5', text:'The secure-SDLC mapping is documented for Discipline 2.', accept:'SDLC-to-pipeline-to-framework-stage diagram published and reviewed.'}
  ],
  diagram:'d-s4-edge-to-data',
  actions:[
    {id:'S4.01', title:'Confirm architecture principles', accountable:'Security Architecture Lead', evidence:'Architecture principles note',
      how:['Restate default-deny, least-privilege and zero-trust-style principles as design constraints for this build.','Confirm principles do not conflict with any approved exception from Baseline.','Publish principles alongside the reference architecture.']},
    {id:'S4.02', title:'Draw current-state vs target-state architecture', accountable:'Security Architecture Lead', evidence:'Current vs target architecture diagrams',
      how:['Lay out the current architecture using Discover discovery data.','Lay out the target architecture using the approved baseline and principles.','Highlight the delta explicitly — this delta becomes the Build backlog.']},
    {id:'S4.03', title:'Define zones and trust boundaries', accountable:'Network architect', evidence:'Zone model',
      how:['Define zones (Internet, Edge, Cloud, On-premises, SaaS) matching the reference-service model from Discover.','Document allowed traffic between zones as a flow matrix.','Confirm default-deny, including egress, is the starting position for every zone boundary.']},
    {id:'S4.04', title:'Place edge, WAF and API management controls', accountable:'Security Architecture Lead', evidence:'Edge control placement diagram',
      how:['Position firewall, WAF, and API management layers ahead of application and data tiers per the reference-service flow.','Document explicitly that these layers do not replace application-level authorisation checks.','Note the origin-lock requirement so the application is not reachable by bypassing the edge layer.']},
    {id:'S4.05', title:'Run the STRIDE-style threat model on the reference service', accountable:'Security Architecture Lead + Application security lead', evidence:'Threat model document',
      how:['List assets (REQUEST_A, customer identity, case status) and entry points (portal, queue, API, SaaS integration).','For each element, step through Spoofing, Tampering, Repudiation, Information disclosure, Denial of service, Elevation of privilege.','Record a mitigation and residual risk rating for each identified threat, using a tool such as Threat Dragon to structure the exercise.','Pay particular attention to the CUSTOMER_A/CUSTOMER_B isolation boundary — this is the threat model\'s primary test case.']},
    {id:'S4.06', title:'Design identity and access architecture', accountable:'IAM lead', evidence:'Identity architecture diagram',
      how:['Design separate identity paths for workforce, customer and workload identities.','Specify phishing-resistant MFA for administrative access and just-in-time elevation for privileged roles.','Document break-glass access procedures separately, with tightened monitoring.']},
    {id:'S4.07', title:'Design data protection and key management architecture', accountable:'Data governance lead', evidence:'Data protection architecture note',
      how:['Specify encryption in transit and at rest per the Cryptography & key management discipline reference profile.','Decide key management placement (managed KMS vs self-hosted vault) as an architecture decision.','Record retention and legal-hold handling for the reference service\'s case data.']},
    {id:'S4.08', title:'Record architecture decisions', accountable:'Security Architecture Lead', evidence:'Architecture decision records',
      how:['Log each material choice (e.g. WAF placement, key management model, identity federation approach) as a decision record.','Reference the relevant agreed decision ID from the Requirements page where applicable.','Circulate decision records for review before Build implementation starts.']},
    {id:'S4.09', title:'Map the secure-SDLC lifecycle to pipeline stages', accountable:'DevSecOps lead', evidence:'SDLC mapping diagram',
      how:['Map plan → design → build → test → release → operate against concrete CI/CD pipeline gates (secret scan, SAST, SCA, IaC scan, image scan, sign, deploy policy, runtime monitoring).','Map each SDLC phase to the framework stage it corresponds to (e.g. "design" aligns to this stage, "operate" aligns to Operate).','Publish the mapping on the Discipline 2 page as the reference diagram for developers.']},
    {id:'S4.10', title:'Design the CI/CD supply-chain control chain', accountable:'DevSecOps lead', evidence:'CI/CD supply-chain diagram',
      how:['Sequence pre-commit secret scanning, PR-time SAST/SCA/IaC scanning, build-time image scanning and SBOM generation, artifact signing, deploy-time policy gating and runtime monitoring.','Name an illustrative tool example at each gate from the Tool catalogue.','Specify the evidence artefact produced at each gate (scan report, SBOM, signature, policy decision log).']},
    {id:'S4.11', title:'Define the operating model', accountable:'Security Architecture Lead', evidence:'Operating model table',
      how:['For every control in the target architecture, name who operates it day to day and who is accountable if it fails.','Distinguish internal team ownership from managed-provider operation, noting the provider never holds accountability.','Cross-reference the operating model to the RACI published in Govern.']},
    {id:'S4.12', title:'Review architecture against the approved baseline', accountable:'Domain delegates', evidence:'Baseline conformance review',
      how:['Check the target architecture satisfies every applicable baseline control from Baseline.','Flag any control the architecture cannot yet satisfy as a Build implementation risk.','Record the review outcome per domain.']},
    {id:'S4.13', title:'Resolve open local-adoption decisions relevant to design', accountable:'Accountable executive', evidence:'Resolved decisions log',
      how:['Work through the Baseline open-decisions log for items that block architecture sign-off (e.g. undefined retention period).','Record resolutions or an explicit deferral with owner and date.','Carry any remaining open items forward into Build with a clear flag.']},
    {id:'S4.14', title:'Confirm Design exit criteria', accountable:'Accountable executive', evidence:'Signed exit criteria record',
      how:['Confirm the architecture, threat model and operating model are complete and reviewed.','Confirm every control in the target architecture has a named operating owner.','Sign the exit criteria record and unlock Build.']}
  ]
});
/* ---- STAGE 5 : Implement, pilot, test and expand ---- */
registerStage({
  id:'S5', num:5, code:'S5', name:'Implement, pilot, test and expand',
  accountable:'Chief Information Security Officer',
  lead:'Security Engineering Lead',
  why:'Design intent only becomes real once it is built, piloted on a limited scope, tested against both success and failure cases, and then rolled out wider — with urgent protection running in parallel throughout rather than waiting for the full rollout to finish.',
  inputs:['Target architecture and operating model (Design)','Approved baseline (Baseline)','Urgent-track referrals (Govern through Design)'],
  standards:['Proposed standard: Release and Change Control Standard','Proposed standard: Pilot Acceptance Standard'],
  externalRefs:['NIST SP 800-53 Rev. 5 control implementation guidance','CIS Controls v8 — Implementation Groups (IG1-3)'],
  greenfield:'Build directly to the target architecture; pilot on the first live service before expanding to the full estate.',
  existing:'Converge greenfield builds and existing-environment remediation onto the same target architecture, running a repair loop for anything that fails pilot testing before wider waves proceed.',
  outputs:['Implemented controls with control records','Pilot test results (positive, negative, failure)','Wave rollout plan and status','Updated exception/urgent-track status'],
  gate:'the pilot service passes its acceptance tests (including negative and failure cases), controls implemented in the pilot have populated control records, and a wave plan exists for remaining scope.',
  bestPractices:[
    {text:'Pilot on one real, representative service before wide rollout — a pilot that only exercises a toy example will miss integration surprises.', stepRef:'S5.03'},
    {text:'Test the negative and failure case explicitly, not just the happy path — a control that only passes its positive test is unproven.', stepRef:'S5.05'},
    {text:'A backup job succeeding is not a recovery test — only a successful restore, exercised end to end, counts as a recovery test.', stepRef:'S5.09'},
    {text:'Run urgent-protection fixes in parallel with the staged rollout — do not let urgent items wait behind the full wave sequence.'},
    {text:'Populate the control record at implementation time, not retrospectively — memory of configuration detail fades fast.', stepRef:'S5.06'},
    {text:'Keep a visible repair loop for pilot failures so a failed test drives a fix, not a silent retry of the same test.', stepRef:'S5.07'}
  ],
  mistakes:[
    {text:'Declaring a control "implemented" once configured, without running the positive, negative and failure tests defined for it.', stepRef:'S5.05'},
    {text:'Expanding to later waves before the pilot\'s failed tests are actually fixed and re-tested.', stepRef:'S5.07'},
    {text:'Recording a scheduled backup job as evidence of a tested recovery capability.', stepRef:'S5.09'}
  ],
  reqs:[
    {id:'REQ-5.1', text:'The pilot service is fully implemented against the target architecture.', accept:'Control records exist for every baseline control applicable to the pilot service.'},
    {id:'REQ-5.2', text:'Positive, negative and failure tests are run and recorded for the pilot.', accept:'Test records show all three test types with expected vs actual outcomes.'},
    {id:'REQ-5.3', text:'A wave rollout plan exists for remaining scope.', accept:'Wave plan lists services/order/target dates covering full Govern scope.'},
    {id:'REQ-5.4', text:'Urgent-track items are resolved or have a documented interim mitigation.', accept:'Urgent-track log shows disposition for every referral raised since Govern.'},
    {id:'REQ-5.5', text:'Recovery capability is tested, not just backup jobs scheduled.', accept:'Recovery test record shows an actual restore exercised end to end.'}
  ],
  diagram:'d-s5-rollout',
  actions:[
    {id:'S5.01', title:'Finalise the pilot scope', accountable:'Security Engineering Lead', evidence:'Pilot scope statement',
      how:['Select one representative in-scope service for the pilot — ideally one exercising several baseline domains at once.','Confirm pilot scope with the accountable executive and affected service owner.','Set a pilot acceptance date.']},
    {id:'S5.02', title:'Stand up shared foundations first', accountable:'Security Engineering Lead', evidence:'Foundations build record',
      how:['Implement shared identity, logging and network foundations before service-specific controls, since later waves depend on them.','Confirm foundations meet the relevant baseline controls (GOV, INV, IAM, NET) before layering service controls on top.','Record foundation control records ahead of the pilot.']},
    {id:'S5.03', title:'Implement pilot controls against the target architecture', accountable:'Security Engineering Lead + domain delegates', evidence:'Pilot implementation log',

    {id:'S7.02', title:'Trace requirement → control → test → evidence → state', accountable:'Security Assurance Lead', evidence:'Traceability sample records',

    {id:'S7.03', title:'Independently verify a sample of evidence', accountable:'Security Assurance Lead', evidence:'Independent verification log',

      how:['Classify each finding by which stage actually owns the fix: a requirement gap goes to Baseline, an architecture flaw to Design, an implementation defect to Build, an operational gap to Operate.','Send the referral to the relevant stage lead with enough context to act.','Track referrals to acknowledgement and resolution, not just to being sent.']},
    {id:'S7.10', title:'Report assurance outcomes to the accountable executive', accountable:'Security Assurance Lead', evidence:'Assurance report',

GLOSSARY.push(
  {term:'Baseline control', def:'One of the minimum-standard controls across the 15 domains that every in-scope service is expected to meet.'},
  {term:'Gate', def:'The documented condition that must be true before a stage is considered complete enough to progress.'},
  {term:'Delegated authority', def:'Decision-making power formally handed by the accountable executive to a named delegate, bounded by an escalation threshold.'},
  {term:'Evidence', def:'A durable artefact (record, log, screenshot, signed document) proving a state — distinct from the state itself.'},
  {term:'Documented / configured / tested / maintained', def:'Four distinct states of a control. A control can be documented without being configured, configured without being tested, and tested once but not maintained.'},
  {term:'Approved exception', def:'A documented, time-bound risk acceptance for a gap against the baseline. It is never equivalent to a passed test.'},
  {term:'Implementation state vs validation state', def:'Whether a control has been built (implementation state) is a separate question from whether it has been proven to work (validation state).'},
  {term:'Origin lock', def:'Configuration ensuring an application\'s origin only accepts traffic that has passed through the edge/WAF layer, blocking direct-to-origin access.'},
  {term:'Dependency-led recovery', def:'Recovering systems in the order their dependencies require (e.g. identity before anything that authenticates against it), not in order of convenience.'},
  {term:'JIT / PIM', def:'Just-in-time / privileged identity management — granting elevated access for a bounded time rather than as a standing right.'},
  {term:'Break-glass', def:'An emergency access path used when normal access methods are unavailable, with heightened logging and mandatory post-use review.'},
  {term:'SBOM', def:'Software bill of materials — a structured inventory of the components in a build artefact.'},
  {term:'CSPM', def:'Cloud security posture management — continuous automated scanning for cloud misconfiguration.'},
  {term:'3-2-1-1-0 rule', def:'A backup posture: 3 copies, on 2 media types, 1 offsite, 1 immutable/offline, with 0 errors after verification.'},

/* ============================================================
   SVG DIAGRAM RENDERER — explicit coordinates, orthogonal edges
   ============================================================ */
const NODE_STYLE = {
  owner:   {stroke:'var(--accent)', fill:'var(--accent-soft)', dash:''},
  actor:   {stroke:'var(--ink-3)',  fill:'var(--surface-2)',   dash:''},
  control: {stroke:'var(--ink-3)',  fill:'var(--surface)',     dash:''},
  decision:{stroke:'var(--amber)',  fill:'var(--amber-soft)',  dash:''},
  data:    {stroke:'var(--ink-3)',  fill:'var(--surface)',     dash:'4 3'},
  ok:      {stroke:'var(--ok)',     fill:'var(--ok-soft)',     dash:''},
  deny:    {stroke:'var(--deny)',   fill:'var(--deny-soft)',   dash:'4 3'},
  risk:    {stroke:'var(--amber)',  fill:'var(--amber-soft)',  dash:'4 3'}
};
const EDGE_STYLE = {
  default:{stroke:'var(--ink-3)', dash:'',     marker:'arw'},
  deny:   {stroke:'var(--deny)',  dash:'5 4',  marker:'arwDeny'},
  loop:   {stroke:'var(--amber)', dash:'5 4',  marker:'arwLoop'},
  return: {stroke:'var(--ink-3)', dash:'4 4',  marker:'arw'}
};
function wrapText(text, maxChars){
  const words = String(text).split(' '); const out=[]; let cur='';
  words.forEach(w=>{ if((cur+' '+w).trim().length>maxChars){ if(cur) out.push(cur.trim()); cur=w; } else cur=(cur+' '+w).trim(); });
  if(cur) out.push(cur.trim());
  return out;
}
function nodeShape(n){
  const st = NODE_STYLE[n.type] || NODE_STYLE.control;
  const {x,y,w,h} = n;
  if(n.type==='decision'){
    const k = Math.min(22, w/5);
    const pts = `${x+k},${y} ${x+w-k},${y} ${x+w},${y+h/2} ${x+w-k},${y+h} ${x+k},${y+h} ${x},${y+h/2}`;
    return `<polygon points="${pts}" fill="${st.fill}" stroke="${st.stroke}" stroke-width="1.4"/>`;
  }
  return `<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="5" fill="${st.fill}" stroke="${st.stroke}" stroke-width="1.4"${st.dash?` stroke-dasharray="${st.dash}"`:''}/>`;
}
function nodeText(n){
  const cx = n.x + n.w/2;
  const titleLines = wrapText(n.title, Math.max(12, Math.floor(n.w/7.2)));
  const subLines = n.sub ? wrapText(n.sub, Math.max(14, Math.floor(n.w/6.2))) : [];
  const lh = 13, subLh = 11.5;
  const total = titleLines.length*lh + (subLines.length? subLines.length*subLh + 3 : 0);
  let ty = n.y + n.h/2 - total/2 + 10;
  let out = '';
  titleLines.forEach(l=>{ out += `<text x="${cx}" y="${ty}" text-anchor="middle" font-size="12.5" font-weight="600" fill="var(--ink)">${esc(l)}</text>`; ty += lh; });
  if(subLines.length){ ty += 2; subLines.forEach(l=>{ out += `<text x="${cx}" y="${ty}" text-anchor="middle" font-size="10.5" fill="var(--ink-2)">${esc(l)}</text>`; ty += subLh; }); }
  return out;
}
function anchorPoint(n, side){
  switch(side){
    case 'l': return [n.x, n.y+n.h/2];
    case 'r': return [n.x+n.w, n.y+n.h/2];
    case 't': return [n.x+n.w/2, n.y];
    case 'b': return [n.x+n.w/2, n.y+n.h];
  }
}
function autoSides(a,b){
  const ac=[a.x+a.w/2,a.y+a.h/2], bc=[b.x+b.w/2,b.y+b.h/2];
  const dx=bc[0]-ac[0], dy=bc[1]-ac[1];
  if(Math.abs(dx) >= Math.abs(dy)) return dx>0?['r','l']:['l','r'];
  return dy>0?['b','t']:['t','b'];
}
function orthPath(a,b,e){
  if(e.points){ return e.points.map((p,i)=>(i?'L':'M')+p[0]+' '+p[1]).join(' '); }
  const [sa,sb] = e.sides || autoSides(a,b);
  const p1 = anchorPoint(a,sa), p2 = anchorPoint(b,sb);
  if(Math.abs(p1[1]-p2[1])<2 || Math.abs(p1[0]-p2[0])<2) return `M${p1[0]} ${p1[1]} L${p2[0]} ${p2[1]}`;
  if(sa==='r'||sa==='l'){
    const mx = e.mid!=null ? e.mid : (p1[0]+p2[0])/2;
    return `M${p1[0]} ${p1[1]} L${mx} ${p1[1]} L${mx} ${p2[1]} L${p2[0]} ${p2[1]}`;
  }
  const my = e.mid!=null ? e.mid : (p1[1]+p2[1])/2;
  return `M${p1[0]} ${p1[1]} L${p1[0]} ${my} L${p2[0]} ${my} L${p2[0]} ${p2[1]}`;
}
function pathMidpoint(d){
  const pts = d.match(/-?\d+(\.\d+)?/g).map(Number);
  const coords=[]; for(let i=0;i<pts.length;i+=2) coords.push([pts[i],pts[i+1]]);
  const i = Math.max(0, Math.floor(coords.length/2)-1);
  const a = coords[i], b = coords[Math.min(i+1, coords.length-1)];
  return [(a[0]+b[0])/2, (a[1]+b[1])/2];
}
function renderDiagram(spec){
  const byId = {}; spec.nodes.forEach(n=>byId[n.id]=n);
  let svg = `<svg viewBox="0 0 ${spec.w} ${spec.h}" role="img" aria-label="${esc(spec.title)}" preserveAspectRatio="xMidYMid meet">`;
  svg += `<defs>
    <marker id="arw" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 Z" fill="var(--ink-3)"/></marker>
    <marker id="arwDeny" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 Z" fill="var(--deny)"/></marker>
    <marker id="arwLoop" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 Z" fill="var(--amber)"/></marker>
    <marker id="xmark" markerWidth="12" markerHeight="12" refX="6" refY="6" orient="auto"><path d="M2 2 L10 10 M10 2 L2 10" stroke="var(--deny)" stroke-width="1.8" fill="none"/></marker>
  </defs>`;
  (spec.zones||[]).forEach(z=>{
    svg += `<rect x="${z.x}" y="${z.y}" width="${z.w}" height="${z.h}" rx="6" fill="none" stroke="var(--rule)" stroke-dasharray="5 4"/>`;
    svg += `<text x="${z.x+10}" y="${z.y+16}" font-size="10.5" font-weight="600" fill="var(--ink-3)" letter-spacing=".02em">${esc(z.label)}</text>`;
  });
  (spec.edges||[]).forEach(e=>{
    const a=byId[e.from], b=byId[e.to]; if(!a||!b) return;
    const st = EDGE_STYLE[e.type||'default'];
    const d = orthPath(a,b,e);
    svg += `<path d="${d}" fill="none" stroke="${st.stroke}" stroke-width="1.4"${st.dash?` stroke-dasharray="${st.dash}"`:''} marker-end="url(#${st.marker})"/>`;
    if(e.type==='deny'){
      const xp = e.xAt || pathMidpoint(d);
      svg += `<rect x="${xp[0]-8}" y="${xp[1]-8}" width="16" height="16" rx="3" fill="var(--surface)"/>`;
      svg += `<path d="M${xp[0]-4} ${xp[1]-4} L${xp[0]+4} ${xp[1]+4} M${xp[0]+4} ${xp[1]-4} L${xp[0]-4} ${xp[1]+4}" stroke="var(--deny)" stroke-width="1.8" fill="none"/>`;
    }
    if(e.label){
      const lp = e.labelAt || pathMidpoint(d);
      const wpx = e.label.length*5.6 + 10;
      svg += `<rect x="${lp[0]-wpx/2}" y="${lp[1]-8}" width="${wpx}" height="15" rx="3" fill="var(--surface)" stroke="none"/>`;
      svg += `<text x="${lp[0]}" y="${lp[1]+3.5}" text-anchor="middle" font-size="10.5" fill="${st.stroke}">${esc(e.label)}</text>`;
    }
  });
  spec.nodes.forEach(n=>{ svg += nodeShape(n) + nodeText(n); });
  svg += `</svg>`;
  const legend = (spec.legend||[]).map(k=>`<span><i class="${k}"></i>${({owner:'Accountable owner',actor:'Actor',control:'Control',decision:'Decision',data:'Data or evidence',ok:'Accepted outcome',deny:'Denied path',risk:'Risk or rework'})[k]}</span>`).join('');
  return `<figure class="dg"><div class="dg-scroll">${svg}</div>
    ${legend?`<div class="legend">${legend}</div>`:''}
    ${spec.caption?`<figcaption>${esc(spec.caption)}</figcaption>`:''}</figure>`;
}
function renderSequence(spec){
  const laneW = Math.floor(spec.w/spec.lanes.length);
  const top = 56, rowH = 46;
  const h = top + spec.steps.length*rowH + 24;
  let svg = `<svg viewBox="0 0 ${spec.w} ${h}" role="img" aria-label="${esc(spec.title)}" preserveAspectRatio="xMidYMid meet">`;
  svg += `<defs><marker id="sarw" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 Z" fill="var(--ink-3)"/></marker></defs>`;
  spec.lanes.forEach((l,i)=>{
    const cx = i*laneW + laneW/2;
    svg += `<rect x="${i*laneW+6}" y="10" width="${laneW-12}" height="34" rx="5" fill="var(--surface-2)" stroke="var(--rule)"/>`;
    wrapText(l, Math.floor(laneW/7)).slice(0,2).forEach((t,j,arr)=>{
      svg += `<text x="${cx}" y="${(arr.length===1?32:26)+j*12}" text-anchor="middle" font-size="11" font-weight="600" fill="var(--ink)">${esc(t)}</text>`;
    });
    svg += `<line x1="${cx}" y1="46" x2="${cx}" y2="${h-14}" stroke="var(--rule)" stroke-dasharray="3 4"/>`;
  });
  spec.steps.forEach((s,i)=>{
    const y = top + i*rowH + 22;
    const x1 = s.from*laneW + laneW/2, x2 = s.to*laneW + laneW/2;
    const dash = s.type==='return' ? ' stroke-dasharray="4 4"' : '';
    if(s.from===s.to){
      svg += `<path d="M${x1} ${y-8} L${x1+34} ${y-8} L${x1+34} ${y+8} L${x1+4} ${y+8}" fill="none" stroke="var(--ink-3)" stroke-width="1.3" marker-end="url(#sarw)"/>`;
      svg += `<text x="${x1+42}" y="${y+3}" font-size="10.5" fill="var(--ink-2)">${esc(s.label)}</text>`;
    } else {
      svg += `<line x1="${x1}" y1="${y}" x2="${x2}" y2="${y}" stroke="var(--ink-3)" stroke-width="1.3"${dash} marker-end="url(#sarw)"/>`;
      const mx=(x1+x2)/2, wpx=s.label.length*5.4+12;
      svg += `<rect x="${mx-wpx/2}" y="${y-16}" width="${wpx}" height="15" rx="3" fill="var(--surface)"/>`;
      svg += `<text x="${mx}" y="${y-5}" text-anchor="middle" font-size="10.5" fill="var(--ink-2)">${esc(s.label)}</text>`;
    }
  });
  svg += `</svg>`;
  return `<figure class="dg"><div class="dg-scroll">${svg}</div>${spec.caption?`<figcaption>${esc(spec.caption)}</figcaption>`:''}</figure>`;
}

function track(currentSlug, opts){
  opts = opts || {};
  const chev = `<nav class="track" aria-label="Lifecycle">` + STAGES.map(s=>{
    const cur = s.slug===currentSlug ? ' aria-current="step"' : '';
    return `<a href="#/stage/${s.slug}"${cur}>${esc(s.short)}</a>`;
  }).join('') + `</nav>`;
  if(opts.bare) return chev;
  return `<div class="lifecycle">
    <div class="wrap-band">Govern is continuous: charter, risk appetite and exceptions are reviewed throughout</div>
    ${chev}
    <div class="loop-band"><span>Assure findings return to the stage that owns the fix</span></div>
  </div>`;
}
function panelList(title, items, cls){
  return `<div class="panel"><h3>${esc(title)}</h3><ul class="${cls||''}">${items.map(i=>`<li>${esc(i)}</li>`).join('')}</ul></div>`;
}
function tableOf(headers, rows){
  return `<div class="tw"><table><thead><tr>${headers.map(h=>`<th>${esc(h)}</th>`).join('')}</tr></thead>
    <tbody>${rows.map(r=>`<tr>${r.map(c=>`<td>${c}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;
}
